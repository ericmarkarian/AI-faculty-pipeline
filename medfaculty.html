<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ATLAS — Academic Talent Location And Sourcing</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  :root {
    /* Accent — Stanford cardinal, used sparingly (deep, muted brick red) */
    --red:        #8C1515;
    --red-hover:  #6E1010;
    --red-dim:    #A6433F;
    --red-bg:     #F7F0EE;
    --red-bg2:    #EAD7D4;
    --red-text:   #6E1010;

    /* Neutrals — warm Stanford 'fog'/sandstone tones */
    --bg:         #FAF9F5;
    --surface:    #F3F1EA;
    --surface2:   #E8E5DA;
    --border:     #D9D4C7;
    --border-sub: #E7E3D8;

    /* Text — warm near-black + stone greys */
    --ink:        #2E2D29;
    --ink2:       #54524B;
    --ink3:       #817C70;

    --qg-bg:      oklch(95%  0.055 145); --qg-bd: oklch(72% 0.13 145); --qg-tx: oklch(40% 0.15 150);
    --qy-bg:      oklch(96%  0.070  85); --qy-bd: oklch(74% 0.15  82); --qy-tx: oklch(47% 0.13  70);
    --qr-bg:      oklch(96%  0.042  22); --qr-bd: oklch(74% 0.13  24); --qr-tx: oklch(47% 0.18  25);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Source Sans 3', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 14.5px;
    line-height: 1.55;
    letter-spacing: 0;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  input, select, button, textarea { font-family: 'Source Sans 3', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .about-btn { transition: background 0.15s, border-color 0.15s; }
  .about-btn:hover { background: rgba(255,255,255,0.16); border-color: rgba(255,255,255,0.85); }

  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  @keyframes fadeUp  { from { opacity:0; transform:translateY(8px);  } to { opacity:1; transform:none; } }
  @keyframes dropIn  { from { opacity:0; transform:translateY(-6px) scale(0.97); } to { opacity:1; transform:none; } }
  @keyframes zoomIn  { from { opacity:0; transform:scale(0.88) translateY(16px); } to { opacity:1; transform:none; } }
  @keyframes spin    { to { transform:rotate(360deg); } }
  /* float + glow intentionally neutralized — the editorial look avoids bobbing/glowing */
  @keyframes float   { 0%,100% { transform:none; } }
  @keyframes glow    { 0%,100% { box-shadow:none; } }
  @keyframes pulse   { 0%,100% { opacity:1; } 50% { opacity:0.45; } }

  /* ── Intro animation: hero "ATLAS" shrinks & flies to the top-left ── */
  @keyframes appReveal { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  @keyframes introOverlayOut { 0%,72% { opacity:1; } 100% { opacity:0; } }
  @keyframes introTitleMove {
    0%   { transform: scale(0.92); opacity:0; }     /* enter */
    7%   { transform: scale(1);    opacity:1; }
    13%  { transform: scale(1.03); opacity:1; }     /* gentle breathe */
    20%  { transform: scale(1);    opacity:1; }
    58%  { transform: scale(1);    opacity:1; }     /* hold big in center */
    100% { transform: translate(calc(-50vw + 122px), calc(-50vh + 28px)) scale(0.30); opacity:0; }  /* fly to top-left */
  }
  @keyframes introTagOut {
    0%   { opacity:0; transform:translateY(6px); }
    10%  { opacity:1; transform:none; }
    42%  { opacity:1; }
    54%  { opacity:0; transform:translateY(-4px); }
    100% { opacity:0; }
  }
  .intro-overlay { animation: introOverlayOut 2.8s ease forwards; }
  .intro-title   { animation: introTitleMove 2.6s cubic-bezier(0.6,0,0.2,1) forwards; transform-origin:center; will-change:transform,opacity; }
  .intro-tag     { animation: introTagOut 2.6s ease forwards; }

  .tr-hover:hover td { background: var(--red-bg) !important; cursor: pointer; }
  .tr-hover:hover .name-cell { color: var(--red) !important; text-decoration: underline; text-underline-offset: 3px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useRef, useEffect, useCallback } = React;

/* ── QC ── */
const QS = {
  green:  { bg:'var(--qg-bg)', bd:'var(--qg-bd)', tx:'var(--qg-tx)' },
  yellow: { bg:'var(--qy-bg)', bd:'var(--qy-bd)', tx:'var(--qy-tx)' },
  red:    { bg:'var(--qr-bg)', bd:'var(--qr-bd)', tx:'var(--qr-tx)' },
};
const QC_LABEL = { green:'High', yellow:'Medium', red:'Low' };

function QcBadge({ overall, onClick }) {
  if (!overall) return <span style={{color:'var(--ink3)',fontSize:12}}>—</span>;
  const q = QS[overall] || {};
  return (
    <button onClick={onClick||undefined} style={{
      display:'inline-flex', alignItems:'center', gap:5,
      padding:'2px 9px', borderRadius:20,
      border:`1px solid ${q.bd||'var(--border)'}`,
      background:q.bg||'var(--surface)', color:q.tx||'var(--ink2)',
      fontSize:10, fontWeight:700, letterSpacing:'0.06em', textTransform:'uppercase',
      cursor:onClick?'pointer':'default',
      transition:'opacity 0.15s, transform 0.18s cubic-bezier(0.16,1,0.3,1)',
    }}
      onMouseEnter={e=>{ if(onClick){ e.currentTarget.style.opacity='0.75'; e.currentTarget.style.transform='scale(1.06) translateY(-1px)'; }}}
      onMouseLeave={e=>{ e.currentTarget.style.opacity='1'; e.currentTarget.style.transform='none'; }}
    >
      <span style={{width:5,height:5,borderRadius:'50%',background:'currentColor',flexShrink:0}}/>
      {QC_LABEL[overall]||overall}
    </button>
  );
}

/* ── Faculty Detail Overlay ── */
function FacultyDetail({ faculty, onClose, onOpenQc }) {
  const qc = faculty.qc || {};
  const h = faculty.h_index;
  const cats = [
    { key:'leadership_roles', label:'Leadership'  },
    { key:'editorial_roles',  label:'Editorial'   },
    { key:'society_roles',    label:'Society'     },
    { key:'training_roles',   label:'Training'    },
  ];
  const grants = useMemo(()=>{
    const titles=(faculty.nih_grant_titles||'').split('|').map(s=>s.trim()).filter(Boolean);
    const nums=(faculty.nih_project_nums||'').split(',').map(s=>s.trim()).filter(Boolean);
    return [...new Map(titles.map((t,i)=>[t,{title:t,num:nums[i]||''}])).values()];
  },[faculty]);

  useEffect(()=>{
    const h=e=>{ if(e.key==='Escape') onClose(); };
    document.addEventListener('keydown',h);
    document.body.style.overflow='hidden';
    return ()=>{ document.removeEventListener('keydown',h); document.body.style.overflow=''; };
  },[onClose]);

  const meta = SCHOOL_META[faculty.school]||{};

  return (
    <div onClick={onClose} style={{
      position:'fixed',inset:0,zIndex:1000,
      background:'oklch(16% 0.022 25 / 0.52)',
      display:'flex',alignItems:'center',justifyContent:'center',
      padding:24,
    }}>
      <div onClick={e=>e.stopPropagation()} style={{
        background:'#fff',width:'100%',maxWidth:720,
        maxHeight:'88vh',overflow:'auto',
        border:'1px solid var(--border)',borderRadius:12,
        boxShadow:'0 40px 100px oklch(16% 0.022 25 / 0.22)',
        animation:'zoomIn 0.28s cubic-bezier(0.16,1,0.3,1)',
      }}>
        {/* Header */}
        <div style={{
          padding:'28px 32px 24px',
          background:'linear-gradient(to bottom, var(--red-bg), #fff)',
          borderBottom:'1px solid var(--border-sub)',
          position:'relative',
        }}>
          <button onClick={onClose} style={{
            position:'absolute',top:20,right:20,
            background:'none',border:'none',fontSize:18,color:'var(--ink3)',
            cursor:'pointer',lineHeight:1,padding:4,borderRadius:4,transition:'color 0.12s',
          }}
            onMouseEnter={e=>e.currentTarget.style.color='var(--ink)'}
            onMouseLeave={e=>e.currentTarget.style.color='var(--ink3)'}
          >✕</button>

          <div style={{fontSize:10,fontWeight:700,letterSpacing:'0.12em',textTransform:'uppercase',
            color:'var(--red)',marginBottom:10}}>Faculty Profile</div>

          <div style={{fontFamily:"'Spectral',serif",fontStyle:'italic',fontSize:30,
            fontWeight:400,color:'var(--ink)',lineHeight:1.15,marginBottom:6}}>
            {faculty.full_name}
          </div>
          <div style={{fontSize:13,color:'var(--ink2)',lineHeight:1.5,maxWidth:'56ch',marginBottom:16}}>
            {faculty.title||'—'}
          </div>
          <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
            <span style={{fontSize:12,color:'var(--ink2)',fontWeight:500}}>{faculty.school}</span>
            {meta.state&&<span style={{fontSize:11,color:'var(--ink3)'}}>· {STATE_NAMES[meta.state]||meta.state}</span>}
            {meta.type&&<span style={{
              fontSize:9,fontWeight:700,padding:'2px 6px',borderRadius:3,
              background:(TYPE_COLOR[meta.type]||{}).bg,color:(TYPE_COLOR[meta.type]||{}).tx,
              letterSpacing:'0.05em',
            }}>{meta.type}</span>}
            {faculty.profile_url&&(
              <a href={faculty.profile_url} target="_blank" rel="noreferrer" style={{
                fontSize:12,color:'var(--red)',textDecoration:'none',fontWeight:600,
                marginLeft:4,
              }}
                onMouseEnter={e=>e.currentTarget.style.textDecoration='underline'}
                onMouseLeave={e=>e.currentTarget.style.textDecoration='none'}
              >View Profile ↗</a>
            )}
          </div>

          {/* Key metrics row */}
          <div style={{display:'flex',gap:0,marginTop:20,
            border:'1px solid var(--border-sub)',borderRadius:8,overflow:'hidden',background:'#fff'}}>
            {[
              { label:'H-Index', value: h!=null ? h : '—', color: h!=null?(h>=30?'var(--qg-tx)':h>=15?'var(--qy-tx)':'var(--ink)'):'var(--ink3)' },
              { label:'NIH Grants', value: faculty.nih_grant_count||0, color:(faculty.nih_grant_count||0)>0?'var(--red)':'var(--ink)' },
              { label:'Total Roles', value: cats.reduce((s,c)=>s+(faculty[c.key]||[]).length,0)||'—', color:'var(--ink)' },
            ].map(({label,value,color},i)=>(
              <div key={label} style={{
                flex:1,padding:'14px 16px',textAlign:'center',
                borderRight:i<2?'1px solid var(--border-sub)':'none',
              }}>
                <div style={{fontFamily:"'Spectral',serif",fontSize:26,fontWeight:600,
                  color,lineHeight:1}}>{value}</div>
                <div style={{fontSize:10,fontWeight:700,color:'var(--ink3)',textTransform:'uppercase',
                  letterSpacing:'0.08em',marginTop:4}}>{label}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Email + Education */}
        <div style={{padding:'20px 32px',borderBottom:'1px solid var(--border-sub)',display:'flex',flexDirection:'column',gap:12}}>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <span style={{fontSize:10,fontWeight:700,color:'var(--ink3)',textTransform:'uppercase',
              letterSpacing:'0.1em',minWidth:56}}>Email</span>
            {faculty.email
              ? <a href={`mailto:${faculty.email}`} style={{fontSize:13,color:'var(--red)',textDecoration:'none'}}
                  onMouseEnter={e=>e.currentTarget.style.textDecoration='underline'}
                  onMouseLeave={e=>e.currentTarget.style.textDecoration='none'}
                >{faculty.email}</a>
              : <span style={{fontSize:13,color:'var(--ink3)'}}>Not available</span>
            }
          </div>
          <div>
            <div style={{fontSize:10,fontWeight:700,color:'var(--ink3)',textTransform:'uppercase',
              letterSpacing:'0.1em',marginBottom:8}}>Medical Training</div>
            {faculty.education&&faculty.education.length>0
              ? faculty.education.map((e,i)=>(
                  <div key={i} style={{
                    display:'flex',alignItems:'baseline',gap:8,
                    padding:'7px 12px',marginBottom:4,borderRadius:6,
                    background:'var(--surface)',border:'1px solid var(--border-sub)',
                  }}>
                    <span style={{fontSize:10,fontWeight:700,color:'var(--ink3)',textTransform:'uppercase',
                      letterSpacing:'0.07em',minWidth:80,flexShrink:0}}>{e.type}</span>
                    <span style={{fontSize:13,color:'var(--ink)',fontWeight:500}}>{e.institution}</span>
                    {e.specialty&&<span style={{fontSize:12,color:'var(--ink2)'}}>· {e.specialty}</span>}
                    {e.year&&<span style={{fontSize:12,color:'var(--ink3)',marginLeft:'auto',flexShrink:0}}>{e.year}</span>}
                  </div>
                ))
              : <span style={{fontSize:13,color:'var(--ink3)'}}>Not available</span>
            }
          </div>
        </div>

        {/* Roles */}
        <div style={{padding:'24px 32px',borderBottom:'1px solid var(--border-sub)'}}>
          <div style={{fontSize:10,fontWeight:700,color:'var(--ink3)',textTransform:'uppercase',
            letterSpacing:'0.12em',marginBottom:16}}>Roles & Leadership</div>
          {cats.every(c=>(faculty[c.key]||[]).length===0)?(
            <div style={{fontSize:13,color:'var(--ink3)'}}>No roles recorded.</div>
          ):cats.map(({key,label})=>{
            const roles=faculty[key]||[];
            if(!roles.length) return null;
            return (
              <div key={key} style={{marginBottom:16}}>
                <div style={{fontSize:10,fontWeight:700,color:'var(--ink2)',textTransform:'uppercase',
                  letterSpacing:'0.09em',marginBottom:8}}>{label}</div>
                {roles.map((r,i)=>(
                  <div key={i} style={{
                    padding:'10px 14px',marginBottom:6,borderRadius:6,
                    background:'var(--surface)',border:'1px solid var(--border-sub)',
                  }}>
                    <div style={{fontSize:13,color:'var(--ink)',fontWeight:600,lineHeight:1.3}}>{r.role}</div>
                    {r.org&&<div style={{fontSize:12,color:'var(--ink2)',marginTop:2}}>{r.org}</div>}
                  </div>
                ))}
              </div>
            );
          })}
        </div>

        {/* NIH Grants */}
        {grants.length>0&&(
          <div style={{padding:'24px 32px',borderBottom:'1px solid var(--border-sub)'}}>
            <div style={{fontSize:10,fontWeight:700,color:'var(--ink3)',textTransform:'uppercase',
              letterSpacing:'0.12em',marginBottom:16}}>NIH Grants
              <span style={{marginLeft:8,color:'var(--red)',fontFamily:"'Spectral',serif",
                fontSize:16,fontWeight:600,letterSpacing:'normal',textTransform:'none'}}>{grants.length}</span>
            </div>
            {grants.map((g,i)=>(
              <div key={i} style={{
                padding:'10px 14px',marginBottom:6,borderRadius:6,
                background:'var(--surface)',border:'1px solid var(--border-sub)',
                display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12,
              }}>
                <span style={{fontSize:13,color:'var(--ink)',fontWeight:500,lineHeight:1.4}}>{g.title}</span>
                {g.num&&<span style={{fontSize:10,color:'var(--ink3)',whiteSpace:'nowrap',flexShrink:0,
                  marginTop:2,fontFamily:'monospace'}}>{g.num}</span>}
              </div>
            ))}
          </div>
        )}

        {/* QC */}
        <div style={{padding:'24px 32px'}}>
          <div style={{fontSize:10,fontWeight:700,color:'var(--ink3)',textTransform:'uppercase',
            letterSpacing:'0.12em',marginBottom:12,display:'flex',alignItems:'center',gap:10}}>
            QC Confidence
            <QcBadge overall={qc.overall}/>
          </div>
          <div style={{display:'flex',flexWrap:'wrap',alignItems:'center',gap:8,marginBottom:12}}>
            {['editorial','society','leadership','training'].map(cat=>(
              <div key={cat} style={{display:'inline-flex',alignItems:'center',gap:5}}>
                <span style={{fontSize:11,color:'var(--ink3)',textTransform:'capitalize'}}>{cat}</span>
                <QcBadge overall={qc[`${cat}_confidence`]}/>
              </div>
            ))}
          </div>
          {qc.overall&&onOpenQc&&(
            <button onClick={onOpenQc} style={{
              fontSize:11,fontWeight:600,color:'var(--red)',background:'none',border:'none',
              padding:0,cursor:'pointer',textDecoration:'underline',letterSpacing:'0.02em',
            }}>View full QC report →</button>
          )}
        </div>
      </div>
    </div>
  );
}

/* ── QC Modal ── */
function QcSection({ label, badge, children, defaultOpen=false }) {
  const [open,setOpen] = useState(defaultOpen);
  const hasContent = React.Children.count(children) > 0;
  return (
    <div style={{borderBottom:'1px solid var(--border-sub)'}}>
      <button onClick={()=>setOpen(o=>!o)} style={{
        width:'100%',display:'flex',alignItems:'center',justifyContent:'space-between',
        padding:'13px 28px',background:'none',border:'none',cursor:'pointer',
        transition:'background 0.12s',
      }}
        onMouseEnter={e=>e.currentTarget.style.background='var(--surface)'}
        onMouseLeave={e=>e.currentTarget.style.background='none'}
      >
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontSize:12,fontWeight:600,color:'var(--ink)',textTransform:'capitalize',
            letterSpacing:'0.02em'}}>{label}</span>
          <QcBadge overall={badge}/>
        </div>
        <span style={{fontSize:14,color:'var(--ink3)',transition:'transform 0.2s',
          transform:open?'rotate(180deg)':'none'}}>▾</span>
      </button>
      {open&&(
        <div style={{padding:'4px 28px 16px'}}>
          {hasContent ? children
            : <div style={{fontSize:12,color:'var(--ink3)',padding:'8px 0'}}>No roles found.</div>
          }
        </div>
      )}
    </div>
  );
}

function CheckRow({ label, value }) {
  const color = value===true?'var(--qg-tx)':value===false?'var(--qr-tx)':'var(--ink3)';
  const icon  = value===true?'✓':value===false?'✗':'—';
  return (
    <span style={{display:'inline-flex',alignItems:'center',gap:4,fontSize:11,color:'var(--ink2)'}}>
      <span style={{fontWeight:600}}>{label}</span>
      <span style={{color,fontWeight:700}}>{icon}</span>
    </span>
  );
}

function QcModal({ faculty, onClose }) {
  const qc = faculty.qc || {};
  const details = qc.role_details || [];
  const cats = ['editorial','society','leadership','training'];
  const grants = useMemo(()=>{
    const titles=(faculty.nih_grant_titles||'').split('|').map(s=>s.trim()).filter(Boolean);
    const nums=(faculty.nih_project_nums||'').split(',').map(s=>s.trim()).filter(Boolean);
    return titles.map((t,i)=>({title:t,num:nums[i]||''}));
  },[faculty]);

  useEffect(()=>{
    const h=e=>{ if(e.key==='Escape') onClose(); };
    document.addEventListener('keydown',h);
    return ()=>document.removeEventListener('keydown',h);
  },[onClose]);

  return (
    <div onClick={onClose} style={{
      position:'fixed',inset:0,zIndex:1100,
      background:'oklch(16% 0.022 25 / 0.50)',
      display:'flex',alignItems:'center',justifyContent:'center',padding:24,
    }}>
      <div onClick={e=>e.stopPropagation()} style={{
        background:'#fff',width:'100%',maxWidth:580,
        maxHeight:'86vh',overflow:'auto',
        border:'1px solid var(--border)',borderRadius:10,
        boxShadow:'0 32px 80px oklch(16% 0.022 25 / 0.18)',
        animation:'zoomIn 0.24s cubic-bezier(0.16,1,0.3,1)',
      }}>

        {/* Header */}
        <div style={{padding:'20px 28px',borderBottom:'1px solid var(--border-sub)',
          display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:16}}>
          <div>
            <div style={{fontSize:10,fontWeight:700,color:'var(--ink3)',textTransform:'uppercase',
              letterSpacing:'0.12em',marginBottom:6}}>QC Report</div>
            <div style={{fontFamily:"'Spectral',serif",fontStyle:'italic',fontSize:19,
              color:'var(--ink)',lineHeight:1.2}}>{faculty.full_name}</div>
            <div style={{fontSize:12,color:'var(--ink2)',marginTop:3}}>{faculty.school}</div>
          </div>
          <div style={{display:'flex',gap:14,flexShrink:0,alignItems:'flex-start'}}>
            <div style={{textAlign:'right'}}>
              <div style={{fontSize:10,color:'var(--ink3)',textTransform:'uppercase',
                letterSpacing:'0.08em',marginBottom:5}}>Overall</div>
              <QcBadge overall={qc.overall}/>
            </div>
            <button onClick={onClose} style={{background:'none',border:'none',fontSize:18,
              color:'var(--ink3)',cursor:'pointer',lineHeight:1,padding:'2px 4px',transition:'color 0.12s'}}
              onMouseEnter={e=>e.currentTarget.style.color='var(--ink)'}
              onMouseLeave={e=>e.currentTarget.style.color='var(--ink3)'}
            >✕</button>
          </div>
        </div>

        {/* How it works blurb */}
        <div style={{padding:'10px 28px',background:'var(--surface)',borderBottom:'1px solid var(--border-sub)'}}>
          <div style={{fontSize:11,color:'var(--ink2)',lineHeight:1.7}}>
            Each role is verified against three independent checks: whether the source URL resolves,
            whether the person's name appears on that page, and whether the role is mentioned there.
            {' '}<span style={{color:'var(--qg-tx)',fontWeight:600}}>High</span> = all three confirmed ·{' '}
            <span style={{color:'var(--qy-tx)',fontWeight:600}}>Medium</span> = partial evidence ·{' '}
            <span style={{color:'var(--qr-tx)',fontWeight:600}}>Low</span> = unverifiable. Click a section to expand.
          </div>
        </div>

        {/* Role categories */}
        {cats.map(cat=>{
          const cr = details.filter(r=>r.category===cat);
          return (
            <QcSection key={cat} label={`${cat} roles`} badge={qc[`${cat}_confidence`]}>
              {cr.map((r,i)=>{
                const q=QS[r.status]||{};
                return (
                  <div key={i} style={{
                    border:`1px solid ${q.bd||'var(--border)'}`,
                    background:q.bg||'var(--surface)',
                    borderRadius:6,padding:'10px 13px',marginBottom:7,
                  }}>
                    <div style={{display:'flex',alignItems:'flex-start',
                      justifyContent:'space-between',gap:8,marginBottom:8}}>
                      <div style={{fontSize:12,lineHeight:1.4}}>
                        <span style={{fontWeight:600,color:'var(--ink)'}}>{r.role}</span>
                        <span style={{color:'var(--ink2)'}}> · {r.org}</span>
                      </div>
                      <QcBadge overall={r.status}/>
                    </div>
                    <div style={{display:'flex',gap:16,flexWrap:'wrap',marginBottom:r.source_url?7:0}}>
                      <CheckRow label="URL alive" value={r.url_alive}/>
                      <CheckRow label="Name on page" value={r.name_on_page}/>
                      <CheckRow label="Role mentioned" value={r.role_on_page}/>
                      {r.negation_detected&&(
                        <span style={{fontSize:11,color:'var(--qy-tx)',fontWeight:600}}>
                          ⚠ Evidence suggests role may be past or inactive
                        </span>
                      )}
                    </div>
                    {r.source_url&&(
                      <a href={r.source_url} target="_blank" rel="noreferrer"
                        style={{fontSize:11,color:'var(--red)',wordBreak:'break-all',
                          textDecoration:'none',display:'block',marginTop:4}}
                        onMouseEnter={e=>e.currentTarget.style.textDecoration='underline'}
                        onMouseLeave={e=>e.currentTarget.style.textDecoration='none'}
                      >↗ View source</a>
                    )}
                    {r.evidence_snippet&&(
                      <div style={{marginTop:7,padding:'7px 9px',background:'oklch(97% 0 0)',
                        borderRadius:4,fontSize:11,color:'var(--ink2)',lineHeight:1.6,
                        fontFamily:'monospace',borderLeft:'2px solid var(--border)'}}>
                        {r.evidence_snippet}
                      </div>
                    )}
                  </div>
                );
              })}
            </QcSection>
          );
        })}

        {/* NIH */}
        <QcSection label="NIH Grants" badge={qc.nih_confidence}>
          {qc.nih_confidence==='yellow'&&(
            <div style={{padding:'8px 10px',marginBottom:10,borderRadius:6,
              background:'var(--qy-bg)',border:'1px solid var(--qy-bd)',
              fontSize:12,color:'var(--qy-tx)',fontWeight:500}}>
              ⚠ Grants found but institution not confirmed — may be from a previous institution.
              Human review recommended.
            </div>
          )}
          {grants.length===0
            ?<div style={{fontSize:12,color:'var(--ink3)'}}>No NIH grants found.</div>
            :grants.map((g,i)=>(
              <div key={i} style={{fontSize:12,color:'var(--ink)',marginBottom:5,lineHeight:1.5}}>
                {g.num&&<span style={{fontFamily:'monospace',color:'var(--ink3)',marginRight:8,fontSize:11}}>{g.num}</span>}
                {g.title}
              </div>
            ))
          }
        </QcSection>

        {/* H-index */}
        <QcSection label="H-Index" badge={qc.hindex_confidence}>
          {qc.consistency_confidence==='yellow'&&qc.consistency_note&&(
            <div style={{padding:'8px 10px',marginBottom:10,borderRadius:6,
              background:'var(--qy-bg)',border:'1px solid var(--qy-bd)',
              fontSize:12,color:'var(--qy-tx)',fontWeight:500}}>
              ⚠ {qc.consistency_note}
            </div>
          )}
          {faculty.h_index!=null
            ?<div style={{fontSize:12,color:'var(--ink)'}}>
                H-index <strong>{faculty.h_index}</strong> — retrieved from {faculty.h_index_source||'Scopus'}.
              </div>
            :<div style={{fontSize:12,color:'var(--ink3)'}}>
                Not found — manual verification may be needed.
              </div>
          }
        </QcSection>

      </div>
    </div>
  );
}

/* ── API Key Modal — first-open prompt for the user's own OpenAI key ── */
function ApiKeyModal({ onDone, onSkip }) {
  const [key,setKey]     = useState('');
  const [show,setShow]   = useState(false);
  const [busy,setBusy]   = useState(false);
  const [error,setError] = useState('');

  useEffect(()=>{
    const h=e=>{ if(e.key==='Escape') onSkip(); };
    document.addEventListener('keydown',h);
    return ()=>document.removeEventListener('keydown',h);
  },[onSkip]);

  const save = async () => {
    if(!key.trim()||busy) return;
    setBusy(true); setError('');
    try {
      const resp=await fetch('/api/key',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:key.trim()})});
      const data=await resp.json();
      if(!resp.ok){ setError(data.error||'Could not save the key.'); setBusy(false); return; }
      onDone(key.trim());
    } catch(e){ setError('Could not reach the server. Is it still running?'); setBusy(false); }
  };

  return (
    <div style={{
      position:'fixed',inset:0,zIndex:1300,
      background:'oklch(16% 0.022 25 / 0.50)',
      display:'flex',alignItems:'center',justifyContent:'center',padding:24,
    }}>
      <div style={{
        background:'#fff',width:'100%',maxWidth:520,
        border:'1px solid var(--border)',borderRadius:10,
        boxShadow:'0 32px 80px oklch(16% 0.022 25 / 0.18)',
        animation:'zoomIn 0.24s cubic-bezier(0.16,1,0.3,1)',
      }}>

        {/* Header */}
        <div style={{padding:'28px 32px 20px',borderBottom:'1px solid var(--border-sub)'}}>
          <div style={{fontSize:10,fontWeight:700,color:'var(--ink3)',textTransform:'uppercase',
            letterSpacing:'0.12em',marginBottom:8}}>Welcome to ATLAS</div>
          <div style={{fontFamily:"'Spectral',serif",fontSize:26,fontWeight:600,color:'var(--ink)',letterSpacing:'-0.01em'}}>
            Connect your AI key
          </div>
        </div>

        {/* Body */}
        <div style={{padding:'22px 32px 28px'}}>
          <p style={{fontSize:13.5,color:'var(--ink2)',lineHeight:1.6,margin:'0 0 18px'}}>
            ATLAS runs searches through your own OpenAI account. Paste your API key below —
            it stays on this computer and is only ever sent to OpenAI. You can create one at{' '}
            <a href="https://platform.openai.com/api-keys" target="_blank" rel="noreferrer"
              style={{color:'var(--red)',fontWeight:600}}>platform.openai.com/api-keys</a>.
          </p>

          <label style={{display:'block',fontSize:10,fontWeight:700,color:'var(--ink3)',
            textTransform:'uppercase',letterSpacing:'0.12em',marginBottom:7}}>OpenAI API key</label>
          <div style={{display:'flex',gap:8}}>
            <input
              type={show?'text':'password'}
              value={key}
              onChange={e=>{setKey(e.target.value);setError('');}}
              onKeyDown={e=>{if(e.key==='Enter')save();}}
              placeholder="sk-…"
              autoFocus spellCheck={false} autoComplete="off"
              style={{flex:1,padding:'9px 11px',border:'1.5px solid var(--border)',borderRadius:8,
                fontSize:13,fontFamily:'ui-monospace,SFMono-Regular,Menlo,monospace',
                color:'var(--ink)',outline:'none',background:'#fff'}}/>
            <button onClick={()=>setShow(s=>!s)} style={{padding:'0 14px',border:'1.5px solid var(--border)',
              borderRadius:8,background:'var(--surface)',color:'var(--ink2)',fontSize:12,fontWeight:600,cursor:'pointer'}}>
              {show?'Hide':'Show'}
            </button>
          </div>

          {error&&<div style={{marginTop:10,fontSize:12.5,lineHeight:1.5,color:'var(--qr-tx)',
            background:'var(--qr-bg)',border:'1px solid var(--qr-bd)',borderRadius:8,padding:'8px 11px'}}>{error}</div>}

          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginTop:20}}>
            <button onClick={onSkip} style={{background:'none',border:'none',cursor:'pointer',
              fontSize:12.5,color:'var(--ink3)',textDecoration:'underline',padding:0}}>
              Skip for now
            </button>
            <button onClick={save} disabled={!key.trim()||busy} style={{
              padding:'9px 22px',border:'none',borderRadius:8,
              background:(!key.trim()||busy)?'var(--surface2)':'var(--red)',
              color:(!key.trim()||busy)?'var(--ink3)':'#fff',
              fontSize:13,fontWeight:700,letterSpacing:'0.02em',
              cursor:(!key.trim()||busy)?'default':'pointer',transition:'background 0.15s',
            }}>
              {busy?'Checking…':'Save & continue'}
            </button>
          </div>
        </div>

      </div>
    </div>
  );
}

/* ── Custom Dropdown ── */
function Dropdown({ value, onChange, options, placeholder, searchable }) {
  const [open,setOpen]=useState(false);
  const [query,setQuery]=useState('');
  const ref=useRef(null);
  const inputRef=useRef(null);

  useEffect(()=>{ if(open&&searchable&&inputRef.current) inputRef.current.focus(); },[open,searchable]);
  useEffect(()=>{ if(!open) setQuery(''); },[open]);
  useEffect(()=>{
    const h=e=>{ if(ref.current&&!ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown',h);
    return ()=>document.removeEventListener('mousedown',h);
  },[]);

  const filtered=searchable&&query?options.filter(o=>o.toLowerCase().includes(query.toLowerCase())):options;

  return (
    <div ref={ref} style={{position:'relative'}}>
      <button onClick={()=>setOpen(o=>!o)} style={{
        width:'100%',padding:'9px 12px',
        display:'flex',justifyContent:'space-between',alignItems:'center',
        background:open?'var(--red-bg)':'#fff',
        border:`1.5px solid ${open?'var(--red)':'var(--border)'}`,
        borderRadius:8,cursor:'pointer',fontSize:13,
        color:value?'var(--ink)':'var(--ink3)',
        boxShadow:open?'0 0 0 3px var(--red-bg2)':'none',
        transition:'all 0.15s',textAlign:'left',
      }}
        onMouseEnter={e=>{ if(!open){ e.currentTarget.style.borderColor='var(--red)'; e.currentTarget.style.transform='translateY(-1px)'; e.currentTarget.style.boxShadow='0 4px 12px oklch(50% 0.26 27 / 0.15)'; }}}
        onMouseLeave={e=>{ if(!open){ e.currentTarget.style.borderColor='var(--border)'; e.currentTarget.style.transform='none'; e.currentTarget.style.boxShadow='none'; }}}
      >
        <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1,marginRight:8}}>{value||placeholder}</span>
        <svg width="11" height="11" viewBox="0 0 11 11" fill="none" style={{
          flexShrink:0,color:'var(--ink3)',
          transform:open?'rotate(180deg)':'none',
          transition:'transform 0.22s cubic-bezier(0.16,1,0.3,1)',
        }}>
          <path d="M1.5 4l4 4 4-4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      </button>

      {open&&(
        <div style={{
          position:'absolute',top:'calc(100% + 4px)',left:0,right:0,zIndex:400,
          background:'#fff',border:'1px solid var(--border)',borderRadius:8,
          boxShadow:'0 12px 40px oklch(16% 0.022 25 / 0.14)',
          animation:'dropIn 0.16s cubic-bezier(0.16,1,0.3,1)',overflow:'hidden',
        }}>
          {searchable&&(
            <div style={{padding:'8px',borderBottom:'1px solid var(--border-sub)'}}>
              <input ref={inputRef} value={query} onChange={e=>setQuery(e.target.value)}
                placeholder="Search…" style={{
                  width:'100%',padding:'6px 10px',fontSize:12,color:'var(--ink)',
                  border:'1.5px solid var(--border)',borderRadius:6,outline:'none',transition:'border-color 0.15s',
                }}
                onFocus={e=>e.target.style.borderColor='var(--red)'}
                onBlur={e=>e.target.style.borderColor='var(--border)'}
              />
            </div>
          )}
          <div style={{maxHeight:210,overflowY:'auto'}}>
            {!filtered.length&&<div style={{padding:'14px 12px',fontSize:12,color:'var(--ink3)',textAlign:'center'}}>No matches</div>}
            {filtered.map(opt=>{
              const active=opt===value;
              return (
                <div key={opt} onClick={()=>{ onChange(opt); setOpen(false); }} style={{
                  padding:'9px 12px',cursor:'pointer',fontSize:13,
                  color:active?'var(--red)':'var(--ink)',
                  background:active?'var(--red-bg)':'transparent',
                  fontWeight:active?600:400,
                  display:'flex',justifyContent:'space-between',alignItems:'center',
                  transition:'background 0.1s',
                }}
                  onMouseEnter={e=>{ if(!active) e.currentTarget.style.background='var(--surface)'; }}
                  onMouseLeave={e=>{ e.currentTarget.style.background=active?'var(--red-bg)':'transparent'; }}
                >
                  {opt}
                  {active&&<svg width="12" height="12" viewBox="0 0 12 12" fill="none" style={{flexShrink:0}}>
                    <path d="M2 6l3 3 5-5" stroke="var(--red)" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                  </svg>}
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

/* ── School Selector ── */
function SchoolSelector({ selected, setSelected, typeFilter }) {
  const [search,setSearch]=useState('');
  const [open,setOpen]=useState(false);
  const ref=useRef(null);
  useEffect(()=>{
    const h=e=>{ if(ref.current&&!ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown',h);
    return ()=>document.removeEventListener('mousedown',h);
  },[]);
  const filtered=useMemo(()=>ALL_SCHOOLS.filter(s=>{
    if(typeFilter!=='ALL'&&s.type!==typeFilter) return false;
    const q=search.toLowerCase();
    return !q||s.name.toLowerCase().includes(q)||(STATE_NAMES[s.state]||'').toLowerCase().includes(q);
  }),[search,typeFilter]);
  const grouped=useMemo(()=>{
    const g={};
    filtered.forEach(s=>{ const st=STATE_NAMES[s.state]||s.state; if(!g[st]) g[st]=[]; g[st].push(s); });
    return Object.entries(g).sort(([a],[b])=>a.localeCompare(b));
  },[filtered]);
  const toggle=name=>setSelected(p=>p.includes(name)?p.filter(x=>x!==name):[...p,name]);
  const label=selected.length===0?'Choose institutions…':selected.length===1?(selected[0].length>36?selected[0].slice(0,36)+'…':selected[0]):`${selected.length} institutions selected`;

  return (
    <div ref={ref} style={{position:'relative'}}>
      <button onClick={()=>setOpen(o=>!o)} style={{
        width:'100%',padding:'9px 12px',
        display:'flex',justifyContent:'space-between',alignItems:'center',
        background:open?'var(--red-bg)':'#fff',
        border:`1.5px solid ${open?'var(--red)':'var(--border)'}`,
        borderRadius:8,cursor:'pointer',fontSize:13,
        color:selected.length?'var(--ink)':'var(--ink3)',
        boxShadow:open?'0 0 0 3px var(--red-bg2)':'none',
        transition:'all 0.15s',textAlign:'left',
      }}
        onMouseEnter={e=>{ if(!open){ e.currentTarget.style.borderColor='var(--red)'; e.currentTarget.style.transform='translateY(-1px)'; e.currentTarget.style.boxShadow='0 4px 12px oklch(50% 0.26 27 / 0.15)'; }}}
        onMouseLeave={e=>{ if(!open){ e.currentTarget.style.borderColor='var(--border)'; e.currentTarget.style.transform='none'; e.currentTarget.style.boxShadow='none'; }}}
      >
        <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1,marginRight:8,fontSize:13}}>{label}</span>
        <svg width="11" height="11" viewBox="0 0 11 11" fill="none" style={{flexShrink:0,color:'var(--ink3)',transform:open?'rotate(180deg)':'none',transition:'transform 0.22s cubic-bezier(0.16,1,0.3,1)'}}>
          <path d="M1.5 4l4 4 4-4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      </button>
      {open&&(
        <div style={{position:'absolute',top:'calc(100% + 4px)',left:0,right:0,zIndex:400,
          background:'#fff',border:'1px solid var(--border)',borderRadius:8,
          boxShadow:'0 12px 40px oklch(16% 0.022 25 / 0.14)',
          animation:'dropIn 0.16s cubic-bezier(0.16,1,0.3,1)',overflow:'hidden'}}>
          <div style={{padding:'8px',borderBottom:'1px solid var(--border-sub)'}}>
            <input autoFocus value={search} onChange={e=>setSearch(e.target.value)}
              placeholder="Search schools or states…" style={{width:'100%',padding:'6px 10px',
                border:'1.5px solid var(--border)',borderRadius:6,fontSize:12,color:'var(--ink)',outline:'none',transition:'border-color 0.15s'}}
              onFocus={e=>e.target.style.borderColor='var(--red)'}
              onBlur={e=>e.target.style.borderColor='var(--border)'}
            />
            <div style={{display:'flex',gap:6,marginTop:6}}>
              {[['Top 25 Pediatric',()=>setSelected([...TOP_PEDS_25])],['Select all',()=>setSelected(filtered.map(s=>s.name))],['Clear',()=>setSelected([])]].map(([l,fn])=>(
                <button key={l} onClick={fn} style={{flex:1,padding:'4px',background:'var(--surface)',
                  border:'1px solid var(--border-sub)',borderRadius:4,cursor:'pointer',fontSize:11,color:'var(--ink2)',fontWeight:500,transition:'all 0.12s'}}
                  onMouseEnter={e=>{ e.currentTarget.style.background='var(--red-bg)'; e.currentTarget.style.color='var(--red)'; }}
                  onMouseLeave={e=>{ e.currentTarget.style.background='var(--surface)'; e.currentTarget.style.color='var(--ink2)'; }}
                >{l}{l==='Select all'?` (${filtered.length})`:''}</button>
              ))}
            </div>
          </div>
          <div style={{overflowY:'auto',maxHeight:260}}>
            {grouped.map(([state,schools])=>(
              <div key={state}>
                <div style={{padding:'6px 12px 2px',fontSize:9,fontWeight:700,color:'var(--ink3)',letterSpacing:'0.12em',textTransform:'uppercase'}}>{state}</div>
                {schools.map(s=>{
                  const sel=selected.includes(s.name);
                  const tc=TYPE_COLOR[s.type]||TYPE_COLOR.MD;
                  return (
                    <div key={s.name} onClick={()=>toggle(s.name)} style={{
                      display:'flex',alignItems:'center',gap:9,padding:'7px 12px',cursor:'pointer',
                      background:sel?'var(--red-bg)':'transparent',transition:'background 0.1s'}}
                      onMouseEnter={e=>{ if(!sel) e.currentTarget.style.background='var(--surface)'; }}
                      onMouseLeave={e=>{ e.currentTarget.style.background=sel?'var(--red-bg)':'transparent'; }}
                    >
                      <div style={{width:14,height:14,borderRadius:3,flexShrink:0,
                        border:`1.5px solid ${sel?'var(--red)':'var(--border)'}`,
                        background:sel?'var(--red)':'#fff',
                        display:'flex',alignItems:'center',justifyContent:'center',
                        transition:'all 0.15s cubic-bezier(0.16,1,0.3,1)'}}>
                        {sel&&<svg width="9" height="9" viewBox="0 0 9 9" fill="none">
                          <path d="M1.5 4.5l2 2 4-4" stroke="#fff" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                        </svg>}
                      </div>
                      <span style={{fontSize:12,color:'var(--ink)',flex:1,lineHeight:1.35}}>{s.name}</span>
                      <span style={{fontSize:9,fontWeight:700,padding:'2px 5px',borderRadius:3,flexShrink:0,background:tc.bg,color:tc.tx,letterSpacing:'0.04em'}}>{s.type}</span>
                    </div>
                  );
                })}
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* ── Shared table utilities ── */
const CELL_STYLE = {padding:'11px 14px',borderBottom:'1px solid var(--border-sub)',verticalAlign:'top'};

function rolesSummary(f) {
  const parts=[];
  if((f.leadership_roles||[]).length) parts.push(`${f.leadership_roles.length} leadership`);
  if((f.editorial_roles||[]).length)  parts.push(`${f.editorial_roles.length} editorial`);
  if((f.society_roles||[]).length)    parts.push(`${f.society_roles.length} society`);
  if((f.training_roles||[]).length)   parts.push(`${f.training_roles.length} training`);
  return parts;
}

const _MD_CREDS = /\b(MD|DO|MBBS|MBBCh|MBChB|MB BCh|MB BChir)\b/i;
function hasMdDegree(f) {
  if(_MD_CREDS.test(f.full_name||'')) return true;
  return (f.education||[]).some(e=>(e.type||'').toLowerCase().includes('medical school'));
}

/* Academic rank stated in a free-text title: 4 full, 3 associate, 2 assistant,
   1 instructor/lecturer, 0 when the title states no rank at all ("Attending Physician",
   "Division Chief", "Associate Program Director", blank). The rank word must sit next
   to "prof…", and the earliest rank in the string wins, so "HS Asst Clinical Professor"
   is an assistant and "Professor of Pediatrics and, by courtesy, Assistant Professor of
   Genetics" is a full professor. */
const RANK_PATTERNS=[
  [3,/\bassoc(?:iate)?\.?\s+(?:[a-z.]+\s+){0,2}prof/],
  [2,/\b(?:assistant|asst|ast)\.?\s+(?:[a-z.]+\s+){0,2}prof/],
  [1,/\b(?:instructor|lecturer)\b/],
  [4,/\bprof(?:essor)?\b/],
];
function rankOf(title) {
  const s=(title||'').toLowerCase();
  let best=0, at=Infinity;
  for(const [rank,re] of RANK_PATTERNS){ const m=re.exec(s); if(m&&m.index<at){ at=m.index; best=rank; } }
  return best;
}

function applyFilters(items, {search,minH,minGrants,rankFilter,mdOnly,sortCol,sortDir,loading,labels}) {
  const RO={instructor:1,assistant:2,associate:3,professor:4};
  let r=items;
  if(search){ const q=search.toLowerCase(); r=r.filter(f=>(f.full_name||'').toLowerCase().includes(q)||(f.school||'').toLowerCase().includes(q)||((labels||{})[f.school]||'').toLowerCase().includes(q)); }
  if(minH)        r=r.filter(f=>(f.h_index??-1)>=+minH);
  if(minGrants)   r=r.filter(f=>(f.nih_grant_count??0)>=+minGrants);
  // A title with no rank in it is "rank unknown", not "below instructor": hospital rosters
  // list attendings without academic rank, and dropping them emptied whole programs.
  if(rankFilter!=='ALL') r=r.filter(f=>{ const k=rankOf(f.title); return k===0||k>=(RO[rankFilter]||0); });
  if(mdOnly) r=r.filter(f=>hasMdDegree(f));
  if(!loading) r=[...r].sort((a,b)=>{
    let av=a[sortCol]??'',bv=b[sortCol]??'';
    if(typeof av==='string'){av=av.toLowerCase();bv=bv.toLowerCase();}
    return sortDir==='asc'?(av<bv?-1:av>bv?1:0):(av>bv?-1:av<bv?1:0);
  });
  return r;
}

  // eslint-disable-next-line

  const animatedNamesRef = useRef(new Set());   // names that have already animated
  const [tick,setTick]               = useState(0);
  const [loading,setLoading]         = useState(false);
  const [ran,setRan]                 = useState(false);
  const [sortCol,setSortCol]         = useState('full_name');
  const [sortDir,setSortDir]         = useState('asc');
  const [tableSearch,setTableSearch] = useState('');
  const [progress,setProgress]       = useState({done:0,total:0,phase:''});
  const [errorMsg,setErrorMsg]       = useState('');
  const [qcModal,setQcModal]         = useState(null);
  const [detailFaculty,setDetail]    = useState(null);
  const [schoolLabels,setSchoolLabels] = useState({});  // pipeline school name → name picked in the selector
  const [discovery,setDiscovery]       = useState([]);  // per-school discovery outcome from Agent 1
  const [aboutOpen,setAboutOpen]     = useState(false);

  /* ── OpenAI key gate — popup on first open until a key has been saved.
     The key can live in two places: the server environment (.env — local
     installs) or this browser's localStorage (shared deployments like Render,
     where each visitor brings their own key and it rides along with each run). ── */
  const getStoredKey=()=>{ try{ return localStorage.getItem('atlas_openai_key')||''; }catch(e){ return ''; } };
  const [keyNeeded,setKeyNeeded]       = useState(false);
  const [keyModalOpen,setKeyModalOpen] = useState(false);
  useEffect(()=>{
    fetch('/api/key-status').then(r=>r.json())
      .then(d=>{ if(!d.configured && !getStoredKey()){ setKeyNeeded(true); setKeyModalOpen(true); } })
      .catch(()=>{});
  },[]);
  const handleKeySaved=useCallback((k)=>{ try{ localStorage.setItem('atlas_openai_key',k); }catch(e){} setKeyNeeded(false); setKeyModalOpen(false); },[]);
  const handleKeySkip =useCallback(()=>{ setKeyModalOpen(false); },[]);

  /* ── Run recovery — the server keeps its own copy of every run, so closing
     the tab loses nothing. On load, offer to restore the most recent run. ── */
  const [resumeInfo,setResumeInfo]     = useState(null);
  const [nlResumeInfo,setNlResumeInfo] = useState(null);
  useEffect(()=>{
    fetch('/api/last-run?kind=search').then(r=>r.json())
      .then(d=>{ if((d.status==='running'||d.status==='completed')&&(d.records||[]).length) setResumeInfo(d); })
      .catch(()=>{});

      .then(d=>{ if((d.status==='running'||d.status==='completed')&&(d.records||[]).length) setNlResumeInfo(d); })
      .catch(()=>{});

  const esRef = useRef(null);

  /* ── Name Lookup tab state ── */
  const [nlSpecialty,setNlSpecialty]   = useState('');
  const [nlInputMode,setNlInputMode]   = useState('manual');
  const [nlParsed,setNlParsed]         = useState([]);
  const [nlParseError,setNlParseError] = useState('');
  const [nlRawText,setNlRawText]       = useState('');
  const [nlFileName,setNlFileName]     = useState('');
  const nlResultsMapRef    = useRef(new Map());
  const nlPendingRef       = useRef([]);
  const nlAnimatedNamesRef = useRef(new Set());
  const [nlTick,setNlTick]             = useState(0);
  const [nlLoading,setNlLoading]       = useState(false);
  const [nlRan,setNlRan]               = useState(false);
  const [nlSortCol,setNlSortCol]       = useState('full_name');
  const [nlSortDir,setNlSortDir]       = useState('asc');
  const [nlTableSearch,setNlTableSearch] = useState('');
  const [nlMinH,setNlMinH]             = useState('');
  const [nlMinGrants,setNlMinGrants]   = useState('');
  const [nlRankFilter,setNlRankFilter] = useState('ALL');
  const [nlMdOnly,setNlMdOnly]         = useState(false);
  const [nlProgress,setNlProgress]     = useState({done:0,total:0,phase:''});
  const [nlErrorMsg,setNlErrorMsg]     = useState('');
  const [nlQcModal,setNlQcModal]       = useState(null);
  const [nlDetail,setNlDetail]         = useState(null);
  const nlEsRef = useRef(null);

  /* ── Search guidance (both tabs) ── */
  const [considerations,setConsiderations]     = useState('');
  const [nlConsiderations,setNlConsiderations] = useState('');

  /* ── Phase 1: batch-flush SSE buffers every 250 ms ── */
  useEffect(()=>{
    const id=setInterval(()=>{
      if(pendingRef.current.length){
        pendingRef.current.forEach(r=>resultsMapRef.current.set(r.full_name,r));
        pendingRef.current=[];
        setTick(t=>t+1);
      }
    },250);
    return ()=>clearInterval(id);
  },[]);
  useEffect(()=>{
    const id=setInterval(()=>{
      if(nlPendingRef.current.length){
        nlPendingRef.current.forEach(r=>nlResultsMapRef.current.set(r.full_name,r));
        nlPendingRef.current=[];
        setNlTick(t=>t+1);
      }
    },250);
    return ()=>clearInterval(id);
  },[]);

  /* ── Stable row handlers (Phase 3) ── */
  const handleRowClick   = useCallback(f=>setDetail(f),[]);
  const handleQcClick    = useCallback(f=>setQcModal(f),[]);
  const handleNlRowClick = useCallback(f=>setNlDetail(f),[]);
  const handleNlQcClick  = useCallback(f=>setNlQcModal(f),[]);

  const hasRun = loading || resultsMapRef.current.size > 0 || ran;
  const canRun = selected.length > 0 && specialty && !loading;

  const attachStream = () => {
    const es=new EventSource('/api/stream'); esRef.current=es;
    es.onmessage=e=>{
      const msg=JSON.parse(e.data);
      if(msg.type==='ping') return;
      if(msg.type==='faculty'){ pendingRef.current.push(msg.data); setProgress({done:msg.completed,total:msg.total,phase:'Enriching faculty…'}); }
      if(msg.type==='discovery'){ setDiscovery(msg.data||[]); }
      if(msg.type==='qc_update'){
        const prev=resultsMapRef.current.get(msg.data.full_name);
        if(prev){ resultsMapRef.current.set(msg.data.full_name,{...prev,qc:msg.data.qc}); setTick(t=>t+1); }
      }
      if(msg.type==='done'){ es.close(); esRef.current=null; setLoading(false); setRan(true); setProgress(p=>({...p,phase:'Complete'})); setTick(t=>t+1); }
      if(msg.type==='error'){ setErrorMsg(msg.message||'Pipeline error'); es.close(); esRef.current=null; setLoading(false); }
    };
    es.onerror=()=>{ setErrorMsg('Stream connection lost.'); es.close(); esRef.current=null; setLoading(false); };
  };

  const runSearch = async () => {
    if (!canRun) return;
    resultsMapRef.current.clear(); pendingRef.current=[]; animatedNamesRef.current.clear(); setTick(0);
    setLoading(true); setRan(false); setErrorMsg(''); setDiscovery([]);
    setProgress({done:0,total:0,phase:`Scraping ${selected.length} institution${selected.length>1?'s':''}…`});
    if(esRef.current){ esRef.current.close(); esRef.current=null; }
    try {
      const resp=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({schools:selected,discipline:specialty,considerations,api_key:getStoredKey()||undefined})});
      if(!resp.ok){ const err=await resp.json(); if(err.code==='no_api_key'){ setKeyModalOpen(true); setLoading(false); return; } setErrorMsg(err.error||'Server error'); setLoading(false); return; }
      const started=await resp.json().catch(()=>({}));
      setSchoolLabels(started.school_labels||{});
    } catch(e){ setErrorMsg('Could not reach server. Is server.py running?'); setLoading(false); return; }
    attachStream();
  };

  /* ── CSV / manual parse helpers ── */
  const parseCsvLine = line => {
    const cols=[]; let cur='', inQ=false;
    for(const ch of line){
      if(ch==='"'){ inQ=!inQ; }
      else if(ch===','&&!inQ){ cols.push(cur.trim()); cur=''; }
      else { cur+=ch; }
    }
    cols.push(cur.trim());
    return cols;
  };

  const parseCsvText = text => {
    const lines=text.trim().split('\n').filter(l=>l.trim());
    if(lines.length<2) return {records:[],error:'CSV needs a header row plus at least one data row.'};
    const hdr=parseCsvLine(lines[0]).map(h=>h.replace(/^"|"$/g,'').toLowerCase().trim());
    const nameIdx=hdr.findIndex(h=>h==='name'||h==='full_name'||h==='fullname');
    const instIdx=hdr.findIndex(h=>h==='institution'||h==='school'||h==='affiliation');
    if(nameIdx===-1) return {records:[],error:'CSV must have a "name" (or "full_name") column.'};
    if(instIdx===-1) return {records:[],error:'CSV must have an "institution" column.'};
    const records=[]; const errors=[];
    for(let i=1;i<lines.length;i++){
      const cols=parseCsvLine(lines[i]);
      const name=(cols[nameIdx]||'').replace(/^"|"$/g,'').trim();
      const inst=(cols[instIdx]||'').replace(/^"|"$/g,'').trim();
      if(!name&&!inst) continue;
      if(!name){ errors.push(`Row ${i+1}: missing name`); continue; }
      if(!inst){ errors.push(`Row ${i+1}: "${name}" is missing an institution`); continue; }
      records.push({full_name:name,institution:inst});
    }
    if(errors.length) return {records,error:errors.slice(0,3).join(' · ')+(errors.length>3?` (+${errors.length-3} more)`:'')};
    return {records,error:''};
  };

  const parseManualText = text => {
    const lines=text.trim().split('\n');
    const records=[]; const errors=[];
    for(let i=0;i<lines.length;i++){
      const line=lines[i].trim();
      if(!line) continue;
      const commaIdx=line.indexOf(',');
      if(commaIdx===-1){ errors.push(`Line ${i+1}: use "Name, Institution" format`); continue; }
      const name=line.slice(0,commaIdx).trim();
      const inst=line.slice(commaIdx+1).trim();
      if(!name){ errors.push(`Line ${i+1}: missing name`); continue; }
      if(!inst){ errors.push(`Line ${i+1}: "${name}" is missing an institution`); continue; }
      records.push({full_name:name,institution:inst});
    }
    if(errors.length) return {records,error:errors.slice(0,3).join(' · ')+(errors.length>3?` (+${errors.length-3} more)`:'')};
    return {records,error:''};
  };

  const handleCsvFile = e => {
    const file=e.target.files[0];
    if(!file) return;
    setNlFileName(file.name);
    const reader=new FileReader();
    reader.onload=ev=>{
      const {records,error}=parseCsvText(ev.target.result);
      setNlParsed(records); setNlParseError(error);
    };
    reader.readAsText(file);
    e.target.value='';
  };

  const handleManualChange = text => {
    setNlRawText(text);
    if(!text.trim()){ setNlParsed([]); setNlParseError(''); return; }
    const {records,error}=parseManualText(text);
    setNlParsed(records); setNlParseError(error);
  };

  /* ── Name Lookup run ── */
  const runNameLookup = async () => {
    if(nlParsed.length===0||nlLoading) return;
    nlResultsMapRef.current.clear(); nlPendingRef.current=[]; nlAnimatedNamesRef.current.clear(); setNlTick(0);
    setNlLoading(true); setNlRan(false); setNlErrorMsg('');
    setNlProgress({done:0,total:0,phase:`Looking up ${nlParsed.length} ${nlParsed.length===1?'person':'people'}…`});
    if(nlEsRef.current){ nlEsRef.current.close(); nlEsRef.current=null; }
    try {
      const resp=await fetch('/api/run-names',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({names:nlParsed,discipline:nlSpecialty,considerations:nlConsiderations,api_key:getStoredKey()||undefined})});
      if(!resp.ok){ const err=await resp.json(); if(err.code==='no_api_key'){ setKeyModalOpen(true); setNlLoading(false); return; } setNlErrorMsg(err.error||'Server error'); setNlLoading(false); return; }
    } catch(e){ setNlErrorMsg('Could not reach server. Is server.py running?'); setNlLoading(false); return; }
    nlAttachStream();
  };

  const nlAttachStream = () => {
    const es=new EventSource('/api/stream-names'); nlEsRef.current=es;
    es.onmessage=e=>{
      const msg=JSON.parse(e.data);
      if(msg.type==='ping') return;
      if(msg.type==='faculty'){ nlPendingRef.current.push(msg.data); setNlProgress({done:msg.completed,total:msg.total,phase:'Enriching…'}); }
      if(msg.type==='qc_update'){
        const prev=nlResultsMapRef.current.get(msg.data.full_name);
        if(prev){ nlResultsMapRef.current.set(msg.data.full_name,{...prev,qc:msg.data.qc}); setNlTick(t=>t+1); }
      }
      if(msg.type==='done'){ es.close(); nlEsRef.current=null; setNlLoading(false); setNlRan(true); setNlProgress(p=>({...p,phase:'Complete'})); setNlTick(t=>t+1); }
      if(msg.type==='error'){ setNlErrorMsg(msg.message||'Pipeline error'); es.close(); nlEsRef.current=null; setNlLoading(false); }
    };
    es.onerror=()=>{ setNlErrorMsg('Stream connection lost.'); es.close(); nlEsRef.current=null; setNlLoading(false); };
  };

  /* ── Restore a run from the server's copy (tab was closed mid- or post-run) ── */
  const restoreRun = (data) => {
    resultsMapRef.current.clear(); pendingRef.current=[]; animatedNamesRef.current.clear();
    (data.records||[]).forEach(r=>{ if(r.full_name){ resultsMapRef.current.set(r.full_name,r); animatedNamesRef.current.add(r.full_name); } });
    if(data.discipline) setSpecialty(data.discipline);
    setSchoolLabels(data.school_labels||{}); setDiscovery(data.discovery||[]);
    setErrorMsg(''); setTick(t=>t+1); setResumeInfo(null); setActiveTab('search');
    if(data.status==='running'){
      setRan(false); setLoading(true);
      const p=data.progress||{};
      setProgress({done:p.done||resultsMapRef.current.size,total:p.total||0,phase:'Reconnected — enriching…'});
      if(esRef.current){ esRef.current.close(); esRef.current=null; }
      attachStream();
    } else {
      setLoading(false); setRan(true);
      setProgress({done:resultsMapRef.current.size,total:resultsMapRef.current.size,phase:'Complete'});
    }
  };

  const nlRestoreRun = (data) => {
    nlResultsMapRef.current.clear(); nlPendingRef.current=[]; nlAnimatedNamesRef.current.clear();
    (data.records||[]).forEach(r=>{ if(r.full_name){ nlResultsMapRef.current.set(r.full_name,r); nlAnimatedNamesRef.current.add(r.full_name); } });
    setNlErrorMsg(''); setNlTick(t=>t+1); setNlResumeInfo(null); setActiveTab('lookup');
    if(data.status==='running'){
      setNlRan(false); setNlLoading(true);
      const p=data.progress||{};
      setNlProgress({done:p.done||nlResultsMapRef.current.size,total:p.total||0,phase:'Reconnected — enriching…'});
      if(nlEsRef.current){ nlEsRef.current.close(); nlEsRef.current=null; }
      nlAttachStream();
    } else {
      setNlLoading(false); setNlRan(true);
      setNlProgress({done:nlResultsMapRef.current.size,total:nlResultsMapRef.current.size,phase:'Complete'});
    }
  };

  /* Warn before closing the tab mid-run (results are recoverable, but the
     live view is nicer to keep) */
  useEffect(()=>{
    const h=e=>{ if(loading||nlLoading){ e.preventDefault(); e.returnValue=''; } };
    window.addEventListener('beforeunload',h);
    return ()=>window.removeEventListener('beforeunload',h);
  },[loading,nlLoading]);

  const displayed = useMemo(()=>
    applyFilters(Array.from(resultsMapRef.current.values()),
      {search:tableSearch,minH,minGrants,rankFilter,mdOnly,sortCol,sortDir,loading,labels:schoolLabels}),
    [tick,loading,tableSearch,minH,minGrants,rankFilter,mdOnly,sortCol,sortDir,schoolLabels]);

  const sort=col=>{ if(sortCol===col) setSortDir(d=>d==='asc'?'desc':'asc'); else{setSortCol(col);setSortDir('asc');} };
  const nlSort=col=>{ if(nlSortCol===col) setNlSortDir(d=>d==='asc'?'desc':'asc'); else{setNlSortCol(col);setNlSortDir('asc');} };

  const nlDisplayed = useMemo(()=>
    applyFilters(Array.from(nlResultsMapRef.current.values()),
      {search:nlTableSearch,minH:nlMinH,minGrants:nlMinGrants,rankFilter:nlRankFilter,mdOnly:nlMdOnly,sortCol:nlSortCol,sortDir:nlSortDir,loading:nlLoading}),
    [nlTick,nlLoading,nlTableSearch,nlMinH,nlMinGrants,nlRankFilter,nlMdOnly,nlSortCol,nlSortDir]);

  // Build the 3 consolidated QC columns ("confidence — why") from a faculty qc dict.
  const qcColumns=(qc)=>{
    if(!qc||!Object.keys(qc).length) return ['','',''];
    const compose=(conf,note)=>conf?(note?`${conf} — ${note}`:conf):'';
    const cs=['editorial','society','leadership','training'].map(k=>qc[k+'_confidence']).filter(Boolean);
    const rolesWorst=cs.includes('red')?'red':cs.includes('yellow')?'yellow':(cs.length?'green':'');
    let rolesWhy=qc.roles_summary||'';
    if(!rolesWhy && qc.role_details){
      rolesWhy=(qc.role_details||[]).map(d=>{
        const reason=d.status==='green'?'verified':[
          (!(d.evidence_snippet||'').trim()?'no evidence text':null),
          (d.url_alive===true&&!d.name_on_page?'wrong page — name not found':null),
          (d.url_alive===false?'source URL dead':null),
          (!d.role_on_page?'role text not found':null),
          (d.negation_detected?'appears former/past':null),
        ].filter(Boolean).join('; ')||'unverified';
        return `[${d.status}] ${d.category||''}: ${d.role||''} @ ${d.org||''} — ${d.source_url||'(no url)'} (${reason})`;
      }).join('\n');
    }
    return [compose(qc.nih_confidence,qc.nih_note), compose(qc.hindex_confidence,qc.hindex_note), rolesWhy?compose(rolesWorst,rolesWhy):rolesWorst];
  };

  const exportCSV=()=>{
    // 'Found Via' (last column) is the discovery source: a row found by web search alone
    // was never confirmed against the institution's own directory page.
    const hdr=['Name','School','State','Title','Email','H-Index','NIH Grants','NIH Grant Titles','Leadership','Academic Editorial Roles','Societies','Educational Leadership Roles','QC — NIH','QC — H-Index','QC — Roles','Education/Training History','Profile URL','Found Via'];
    const fmtEducation=edu=>(edu||[]).map(e=>{
      const parts=[e.type,e.institution,e.specialty].filter(Boolean).join(', ');
      return e.year?`${parts} (${e.year})`:parts;
    }).join('; ');
    const rows=displayed.map(f=>{
      const school=schoolLabels[f.school]||f.school;
      const meta=SCHOOL_META[school]||SCHOOL_META[f.school]||{};
      const fmt=arr=>(arr||[]).map(r=>[r.role,r.org].filter(Boolean).join(' @ ')).filter(Boolean).join('; ');
      const gt=[...new Set((f.nih_grant_titles||'').split('|').map(s=>s.trim()).filter(Boolean))].join('; ');
      const qc=f.qc||{};
      const [qcNih,qcHindex,qcRoles]=qcColumns(qc);
      return[f.full_name,school,meta.state||'',f.title||'',f.email||'',f.h_index??'',f.nih_grant_count||0,gt,
        fmt(f.leadership_roles),fmt(f.editorial_roles),fmt(f.society_roles),fmt(f.training_roles),
        qcNih,qcHindex,qcRoles,
        fmtEducation(f.education),
        f.profile_url||'',
        f.discovery_source||''];
    });
    const csv=[hdr,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
    // The export is the filtered view; say so in the file name so a partial list is never mistaken for the full run.
    a.download=`faculty_${(specialty||'search').replace(/\s+/g,'_')}${resultsMapRef.current.size!==displayed.length?'_filtered':''}.csv`;
    a.click();
  };

  const nlExportCSV=()=>{
    const hdr=['Name','Institution','Title','Email','H-Index','NIH Grants','NIH Grant Titles','Leadership','Academic Editorial Roles','Societies','Educational Leadership Roles','QC — NIH','QC — H-Index','QC — Roles','Education/Training History','Profile URL'];
    const fmtEducation=edu=>(edu||[]).map(e=>{
      const parts=[e.type,e.institution,e.specialty].filter(Boolean).join(', ');
      return e.year?`${parts} (${e.year})`:parts;
    }).join('; ');
    const rows=nlDisplayed.map(f=>{
      const fmt=arr=>(arr||[]).map(r=>[r.role,r.org].filter(Boolean).join(' @ ')).filter(Boolean).join('; ');
      const gt=[...new Set((f.nih_grant_titles||'').split('|').map(s=>s.trim()).filter(Boolean))].join('; ');
      const qc=f.qc||{};
      const [qcNih,qcHindex,qcRoles]=qcColumns(qc);
      return[f.full_name,f.school,f.title||'',f.email||'',f.h_index??'',f.nih_grant_count||0,gt,
        fmt(f.leadership_roles),fmt(f.editorial_roles),fmt(f.society_roles),fmt(f.training_roles),
        qcNih,qcHindex,qcRoles,
        fmtEducation(f.education),
        f.profile_url||''];
    });
    const csv=[hdr,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
    a.download='faculty_lookup.csv';
    a.click();
  };

  const pct=progress.total>0?Math.round((progress.done/progress.total)*100):(loading?5:0);
  const totalRows=resultsMapRef.current.size;
  const hiddenRows=totalRows-displayed.length;
  const unrankedShown=rankFilter!=='ALL'?displayed.filter(f=>rankOf(f.title)===0).length:0;
  const discoveryIssues=discovery.filter(d=>(d.issues||[]).length>0);
  const withH=displayed.filter(f=>f.h_index!=null);
  const nihN=displayed.filter(f=>(f.nih_grant_count||0)>0).length;
  const avgH=withH.length?Math.round(withH.reduce((s,f)=>s+(f.h_index||0),0)/withH.length):null;

  const nlPct=nlProgress.total>0?Math.round((nlProgress.done/nlProgress.total)*100):(nlLoading?5:0);
  const nlWithH=nlDisplayed.filter(f=>f.h_index!=null);
  const nlNihN=nlDisplayed.filter(f=>(f.nih_grant_count||0)>0).length;
  const nlAvgH=nlWithH.length?Math.round(nlWithH.reduce((s,f)=>s+(f.h_index||0),0)/nlWithH.length):null;

  const inp={width:'100%',padding:'8px 10px',border:'1.5px solid var(--border)',borderRadius:8,fontSize:13,color:'var(--ink)',outline:'none',background:'#fff',transition:'border-color 0.15s, box-shadow 0.15s'};

  const Th=({label,col})=>(
    <th onClick={()=>col&&sort(col)} style={{
      padding:'10px 14px',textAlign:'left',fontSize:10,fontWeight:700,letterSpacing:'0.09em',
      textTransform:'uppercase',color:'var(--ink3)',cursor:col?'pointer':'default',whiteSpace:'nowrap',
      background:'var(--surface)',borderBottom:'1px solid var(--border)',userSelect:'none',
    }}>
      {label}{col&&<span style={{marginLeft:4,color:sortCol===col?'var(--red)':'var(--border)'}}>
        {sortCol===col?(sortDir==='asc'?'↑':'↓'):'↕'}
      </span>}
    </th>
  );
  const NlTh=({label,col})=>(
    <th onClick={()=>col&&nlSort(col)} style={{
      padding:'10px 14px',textAlign:'left',fontSize:10,fontWeight:700,letterSpacing:'0.09em',
      textTransform:'uppercase',color:'var(--ink3)',cursor:col?'pointer':'default',whiteSpace:'nowrap',
      background:'var(--surface)',borderBottom:'1px solid var(--border)',userSelect:'none',
    }}>
      {label}{col&&<span style={{marginLeft:4,color:nlSortCol===col?'var(--red)':'var(--border)'}}>
        {nlSortCol===col?(nlSortDir==='asc'?'↑':'↓'):'↕'}
      </span>}
    </th>
