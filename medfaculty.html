  return (
    <React.Fragment>
      {intro&&(
        <div className="intro-overlay" style={{position:'fixed',inset:0,zIndex:9999,background:'var(--bg)',
          display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',pointerEvents:'none'}}>
          <div className="intro-title" style={{fontFamily:"'Spectral',serif",fontWeight:600,
            fontSize:'clamp(40px,7.5vw,76px)',letterSpacing:'0.06em',color:'var(--red)',lineHeight:1}}>
            ATLAS
          </div>
          <div className="intro-tag" style={{fontFamily:"'Spectral',serif",fontStyle:'italic',
            fontSize:'clamp(14px,1.5vw,18px)',color:'var(--ink3)',marginTop:14,letterSpacing:'0.01em'}}>
            Academic Talent Location And Sourcing
          </div>
        </div>
      )}
    <div style={{minHeight:'100vh',background:'var(--bg)',display:'flex',flexDirection:'column',
      animation:intro?'appReveal 0.8s 1.85s both':'none'}}>
      {detailFaculty&&<FacultyDetail faculty={detailFaculty} onClose={()=>setDetail(null)} onOpenQc={()=>setQcModal(detailFaculty)}/>}
      {qcModal&&<QcModal faculty={qcModal} onClose={()=>setQcModal(null)}/>}
      {nlDetail&&<FacultyDetail faculty={nlDetail} onClose={()=>setNlDetail(null)} onOpenQc={()=>setNlQcModal(nlDetail)}/>}
      {nlQcModal&&<QcModal faculty={nlQcModal} onClose={()=>setNlQcModal(null)}/>}
      {aboutOpen&&<AboutModal onClose={()=>setAboutOpen(false)}/>}
      {!intro&&keyModalOpen&&<ApiKeyModal onDone={handleKeySaved} onSkip={handleKeySkip}/>}

      {/* Topbar — cardinal masthead */}
      <div style={{background:'var(--red)',padding:'0 36px',flexShrink:0}}>
        <div style={{maxWidth:1440,margin:'0 auto',height:54,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div style={{display:'flex',alignItems:'baseline',gap:12}}>
            <span style={{fontFamily:"'Spectral',serif",fontSize:20,fontWeight:600,letterSpacing:'0.08em',color:'#fff'}}>ATLAS</span>
            <span style={{width:1,height:14,background:'rgba(255,255,255,0.35)',alignSelf:'center'}}/>
            <span style={{fontFamily:"'Spectral',serif",fontStyle:'italic',fontSize:12.5,color:'rgba(255,255,255,0.8)',letterSpacing:'0.01em'}}>Academic Talent Location And Sourcing</span>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:18}}>
            {keyNeeded&&<button className="about-btn" onClick={()=>setKeyModalOpen(true)} style={{padding:'5px 16px',border:'1px solid rgba(255,255,255,0.5)',borderRadius:999,background:'rgba(255,255,255,0.12)',color:'#fff',fontSize:12.5,fontWeight:600,letterSpacing:'0.04em',cursor:'pointer'}}>Add API key</button>}
            <button className="about-btn" onClick={()=>setAboutOpen(true)} style={{padding:'5px 16px',border:'1px solid rgba(255,255,255,0.5)',borderRadius:999,background:'transparent',color:'#fff',fontSize:12.5,fontWeight:600,letterSpacing:'0.04em',cursor:'pointer'}}>About</button>
          </div>
        </div>
      </div>

      {/* Tab navigation */}
      <div style={{background:'#fff',borderBottom:'1px solid var(--border)',flexShrink:0}}>
        <div style={{maxWidth:1440,margin:'0 auto',padding:'0 36px',display:'flex',gap:0}}>
          {[['search','School Search'],['lookup','Name Lookup']].filter(([t])=>!(manualOnly&&t==='search')).map(([t,label])=>(
            <button key={t} onClick={()=>setActiveTab(t)} style={{
              padding:'11px 20px',border:'none',
              borderBottom:activeTab===t?'2px solid var(--red)':'2px solid transparent',
              background:'none',fontSize:13,fontWeight:activeTab===t?700:400,
              color:activeTab===t?'var(--red)':'var(--ink2)',
              cursor:'pointer',transition:'color 0.15s',marginBottom:-1,
            }}>
              {label}
              {t==='search'&&(ran||loading)&&<span style={{marginLeft:6,fontSize:10,fontWeight:700,color:loading?'var(--red-text)':'var(--qg-tx)',background:loading?'var(--red-bg2)':'var(--qg-bg)',padding:'1px 6px',borderRadius:10}}>{loading?'live':`${resultsMapRef.current.size}`}</span>}
              {t==='lookup'&&(nlRan||nlLoading)&&<span style={{marginLeft:6,fontSize:10,fontWeight:700,color:nlLoading?'var(--red-text)':'var(--qg-tx)',background:nlLoading?'var(--red-bg2)':'var(--qg-bg)',padding:'1px 6px',borderRadius:10}}>{nlLoading?'live':`${nlResultsMapRef.current.size}`}</span>}
            </button>
          ))}
        </div>
      </div>

      {/* Run recovery banner — the server kept the results; offer them back */}
      {(resumeInfo||nlResumeInfo)&&(
        <div style={{background:'var(--qy-bg)',borderBottom:'1px solid var(--qy-bd)',flexShrink:0}}>
          <div style={{maxWidth:1440,margin:'0 auto',padding:'0 36px'}}>
            {[[resumeInfo,'School search',restoreRun,setResumeInfo],[nlResumeInfo,'Name lookup',nlRestoreRun,setNlResumeInfo]].map(([info,label,restore,dismiss])=>info&&(
              <div key={label} style={{display:'flex',alignItems:'center',gap:14,flexWrap:'wrap',padding:'9px 0'}}>
                <span style={{fontSize:13,color:'var(--qy-tx)'}}>
                  {info.status==='running'
                    ? `${label} still running on the server`
                    : `Your last ${label.toLowerCase()} finished`}
                  {info.discipline?` — ${info.discipline}`:''} · {info.records.length} result{info.records.length===1?'':'s'} saved
                </span>
                <button onClick={()=>restore(info)} style={{padding:'4px 14px',border:'none',borderRadius:6,
                  background:'var(--red)',color:'#fff',fontSize:12,fontWeight:700,cursor:'pointer'}}>
                  {info.status==='running'?'Reconnect':'Restore results'}
                </button>
                <button onClick={()=>dismiss(null)} style={{padding:'4px 10px',border:'none',background:'none',
                  color:'var(--qy-tx)',fontSize:12,cursor:'pointer',textDecoration:'underline'}}>Dismiss</button>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Per-tab description — editorial standfirst */}
      <div style={{background:'var(--bg)',borderBottom:'1px solid var(--border-sub)',flexShrink:0}}>
        <div style={{maxWidth:1440,margin:'0 auto',padding:'20px 36px'}}>
          <div style={{borderLeft:'2px solid var(--red)',paddingLeft:18,maxWidth:780}}>
            <div style={{fontFamily:"'Spectral',serif",fontSize:18,fontWeight:600,color:'var(--ink)',letterSpacing:'-0.01em',marginBottom:4}}>
              {activeTab==='search'?'Sweep a whole specialty':'Look up specific people'}
            </div>
            <div style={{fontSize:14,color:'var(--ink2)',lineHeight:1.6}}>
              {activeTab==='search'
                ? <span>Pick one or more institutions and a specialty — ATLAS pulls the full faculty roster from each school's directory and enriches everyone with h-index, NIH grants, leadership &amp; editorial roles, and training history.</span>
                : <span>Already have names in mind? Type them in (or upload a CSV) with each person's institution, and ATLAS enriches just those individuals with the same data.</span>}
            </div>
          </div>
        </div>
      </div>

      {/* Body */}
      <div style={{flex:1,width:'100%',maxWidth:1440,margin:'0 auto',padding:'34px 36px 56px'}}>

        {/* ── SCHOOL SEARCH TAB ── */}
        {activeTab==='search'&&(<>
        <div style={{display:'flex',justifyContent:'flex-start',gap:44,alignItems:'flex-start'}}>

          {/* Sidebar */}
          <div style={{flexShrink:0,width:hasRun?238:392,transition:'width 0.55s cubic-bezier(0.16,1,0.3,1)'}}>
            <div style={{position:'sticky',top:24,width:hasRun?238:392,transition:'width 0.55s cubic-bezier(0.16,1,0.3,1)'}}>

              <SLabel>Program type</SLabel>
              <Pills value={typeFilter} onChange={v=>{setTypeFilter(v);setSelected([]);}}
                options={[['ALL','All'],['MD','MD'],['DO','DO'],['Pipeline','Hospitals']]}/>
              <Divider/>

              <SLabel>Institutions{selected.length>0&&<span style={{color:'var(--red)',fontWeight:700}}> · {selected.length}</span>}</SLabel>
              <SchoolSelector selected={selected} setSelected={setSelected} typeFilter={typeFilter}/>
              <Divider/>

              <SLabel>Specialty / Discipline</SLabel>
              <Dropdown value={specialty} onChange={setSpecialty} options={SPECIALTIES} placeholder="Select a specialty…" searchable/>
              <Divider/>

              <SLabel>Search guidance <span style={{fontWeight:400,color:'var(--ink3)'}}>— optional</span></SLabel>
              <div style={{fontSize:11,color:'var(--ink3)',marginBottom:6,lineHeight:1.5}}>
                Journals, societies, or leadership roles to prioritize (e.g. "NEJM editorial board, AHA committee chairs, fellowship directors")
              </div>
              <textarea
                value={considerations}
                onChange={e=>setConsiderations(e.target.value)}
                placeholder="e.g. focus on NEJM and JAMA editorial boards, AHA committee roles, NIH study section chairs…"
                rows={3}
                style={{width:'100%',padding:'9px 10px',border:'1.5px solid var(--border)',borderRadius:8,
                  fontSize:12,color:'var(--ink)',outline:'none',background:'#fff',
                  resize:'vertical',lineHeight:1.5,transition:'border-color 0.15s',fontFamily:'inherit',
                  boxSizing:'border-box',
                }}
                onFocus={e=>e.target.style.borderColor='var(--red)'}
                onBlur={e=>e.target.style.borderColor='var(--border)'}
              />
              <Divider/>

              <SLabel>Filters</SLabel>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:12}}>
                <div>
                  <div style={{fontSize:10,color:'var(--ink3)',marginBottom:5}}>Min H-Index</div>
                  <input type="number" min="0" value={minH} onChange={e=>setMinH(e.target.value)} placeholder="e.g. 10" style={inp}
                    onFocus={e=>{ e.target.style.borderColor='var(--red)'; e.target.style.boxShadow='0 0 0 3px var(--red-bg2)'; }}
                    onBlur={e=>{ e.target.style.borderColor='var(--border)'; e.target.style.boxShadow='none'; }}/>
                </div>
                <div>
                  <div style={{fontSize:10,color:'var(--ink3)',marginBottom:5}}>Min NIH</div>
                  <input type="number" min="0" value={minGrants} onChange={e=>setMinGrants(e.target.value)} placeholder="e.g. 1" style={inp}
                    onFocus={e=>{ e.target.style.borderColor='var(--red)'; e.target.style.boxShadow='0 0 0 3px var(--red-bg2)'; }}
                    onBlur={e=>{ e.target.style.borderColor='var(--border)'; e.target.style.boxShadow='none'; }}/>
                </div>
              </div>
              <div style={{marginBottom:16}}>
                <div style={{fontSize:10,color:'var(--ink3)',marginBottom:6}}>Academic Rank</div>
                <Pills value={rankFilter} onChange={setRankFilter}
                  options={[['ALL','Any'],['instructor','Instr+'],['assistant','Asst+'],['associate','Assoc+'],['professor','Full']]}/>
              </div>
              <div style={{marginBottom:16}}>
                <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',userSelect:'none'}}>
                  <input type="checkbox" checked={mdOnly} onChange={e=>setMdOnly(e.target.checked)}
                    style={{width:14,height:14,accentColor:'var(--red)',cursor:'pointer'}}/>
                  <span style={{fontSize:11,color:'var(--ink2)',fontWeight:500}}>MD / DO / MBBS only</span>
                </label>
              </div>

              {errorMsg&&<div style={{marginBottom:12,padding:'9px 12px',borderRadius:6,background:'var(--qr-bg)',border:'1px solid var(--qr-bd)',color:'var(--qr-tx)',fontSize:12,fontWeight:500}}>{errorMsg}</div>}

              {/* Run button */}
              <button onClick={runSearch} disabled={!canRun} style={{
                width:'100%',padding:'11px',borderRadius:8,border:'none',
                background:canRun?'var(--red)':'var(--surface2)',
                color:canRun?'#fff':'var(--ink3)',
                fontSize:13,fontWeight:700,letterSpacing:'0.02em',
                cursor:canRun?'pointer':'not-allowed',
                transition:'background 0.15s, transform 0.12s, box-shadow 0.15s',
                animation:canRun?'glow 2.5s ease-in-out infinite':'none',

                onMouseEnter={e=>{ if(canRun){ e.currentTarget.style.background='var(--red-hover)'; e.currentTarget.style.transform='translateY(-2px)'; e.currentTarget.style.animation='none'; e.currentTarget.style.boxShadow='0 8px 24px oklch(50% 0.26 27 / 0.45)'; }}}
                onMouseLeave={e=>{ if(canRun){ e.currentTarget.style.background='var(--red)'; e.currentTarget.style.transform='none'; e.currentTarget.style.animation='glow 2.5s ease-in-out infinite'; }}}
                onMouseDown={e=>{ if(canRun) e.currentTarget.style.transform='translateY(0) scale(0.98)'; }}
                onMouseUp={e=>{ if(canRun) e.currentTarget.style.transform='translateY(-2px)'; }}
              >
                {loading
                  ?<span style={{display:'inline-flex',alignItems:'center',gap:8,justifyContent:'center'}}>

                        <button onClick={nlExportCSV} style={{padding:'7px 13px',border:'1px solid var(--border)',borderRadius:8,background:'#fff',fontSize:12,fontWeight:600,cursor:'pointer',color:'var(--ink2)',transition:'all 0.15s'}}
                          onMouseEnter={e=>{ e.currentTarget.style.borderColor='var(--red)'; e.currentTarget.style.color='var(--red)'; e.currentTarget.style.transform='translateY(-1px)'; }}
                          onMouseLeave={e=>{ e.currentTarget.style.borderColor='var(--border)'; e.currentTarget.style.color='var(--ink2)'; e.currentTarget.style.transform='none'; }}
                        >↓ Export CSV</button>
                      )}
                    </div>
                  </div>
                  {nlDisplayed.length>0&&(
                    <div style={{fontSize:11,color:'var(--ink3)',marginBottom:8}}>Click any name to view full profile</div>
                  )}
                  <div style={{background:'#fff',border:'1px solid var(--border)',borderRadius:10,overflow:'hidden'}}>
                    <table style={{width:'100%',borderCollapse:'collapse',tableLayout:'fixed'}}>
                      <colgroup>
                        <col style={{width:'16%'}}/><col style={{width:'19%'}}/><col style={{width:'16%'}}/>
                        <col style={{width:'7%'}}/><col style={{width:'14%'}}/><col style={{width:'20%'}}/><col style={{width:'8%'}}/>
                      </colgroup>
                      <thead>
                        <tr>
                          <NlTh label="Name"        col="full_name"/>
                          <NlTh label="Institution"  col="school"/>
                          <NlTh label="Rank"         col="title"/>
                          <NlTh label="H-Index"      col="h_index"/>
                          <NlTh label="NIH Grants"   col="nih_grant_count"/>
                          <NlTh label="Roles"        col={null}/>
                          <NlTh label="QC"           col={null}/>
                        </tr>
                      </thead>
                      <tbody>
                        {nlDisplayed.map(f=>{
                          const isNew=!nlAnimatedNamesRef.current.has(f.full_name);
                          if(isNew) nlAnimatedNamesRef.current.add(f.full_name);
                          return <NlFacultyRow key={f.full_name} faculty={f} isNew={isNew} onRowClick={handleNlRowClick} onQcClick={handleNlQcClick}/>;
                        })}
                      </tbody>
                    </table>
                    {nlDisplayed.length===0&&(
                      <div style={{padding:'48px 0',textAlign:'center',color:'var(--ink3)',fontSize:13}}>No results match current filters.</div>
                    )}
                  </div>
                </div>
              )}

              {/* Empty state — lookup tab */}
              {!nlHasRun&&(
                <div style={{textAlign:'center',marginTop:52,animation:'fadeUp 0.5s 0.1s ease both'}}>
                  <div style={{animation:'float 4s ease-in-out infinite'}}>
                    <div style={{fontFamily:"'Spectral',serif",fontStyle:'italic',fontSize:28,color:'var(--ink3)',letterSpacing:'-0.01em',marginBottom:10}}>
                      Upload or paste names
                    </div>
                    <div style={{fontSize:13,color:'var(--ink3)',lineHeight:1.7}}>
                      Provide a CSV or type names with institutions,<br/>then run enrichment.
                    </div>
                  </div>
                </div>
              )}

            </div>
          );
        })()}

      </div>

      {/* Footer */}
      <div style={{borderTop:'1px solid var(--border-sub)',background:'#fff',flexShrink:0}}>
        <div style={{maxWidth:1440,margin:'0 auto',padding:'12px 36px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <span style={{fontSize:11,color:'var(--ink3)'}}>ATLAS · {MD_SCHOOLS.length+DO_SCHOOLS.length} accredited programs</span>
          <span style={{fontSize:11,color:'var(--ink3)'}}>Sources: LCME · AOA · NIH Reporter · Scopus</span>
        </div>
      </div>
    </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
