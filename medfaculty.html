function generateMockFaculty(schools, specialty, count) {
  const firsts = ["James","Maria","David","Sarah","Michael","Jennifer","Robert","Lisa","William","Amanda","Thomas","Patricia","Charles","Christopher","Jessica","Matthew","Emily","Joshua","Andrew","Rachel"];
  const lasts = ["Chen","Patel","Johnson","Williams","Brown","Garcia","Martinez","Davis","Lopez","Wilson","Anderson","Taylor","Moore","Jackson","Harris","Martin","Thompson","White","Lee","Perez"];
  const titles = ["Assistant Professor","Associate Professor","Professor","Clinical Associate Professor","Clinical Professor","Instructor"];
  return Array.from({ length: count }, (_, i) => {
    const school = schools[i % schools.length];
    const first = firsts[Math.floor(Math.random() * firsts.length)];
    const last = lasts[Math.floor(Math.random() * lasts.length)];
    const cred = school.type === "DO" ? "DO" : (Math.random() > 0.4 ? "MD, PhD" : "MD");
    return {
      id: i,
      name: `${first} ${last}, ${cred}`,
      school: school.name,
      state: school.state,
      type: school.type,
      title: titles[Math.floor(Math.random() * titles.length)],
      specialty,
      hIndex: Math.floor(Math.random() * 46) + 2,
      nihGrants: Math.floor(Math.random() * 4),
      email: `${first.toLowerCase()}.${last.toLowerCase()}@${school.name.split(" ")[0].toLowerCase()}.edu`,
      confidence: Math.floor(Math.random() * 22) + 78,
      flagged: Math.random() > 0.88,
    };
  });
}

function SchoolSelector({ selected, setSelected, typeFilter }) {
  const [search, setSearch] = useState("");
  const [open, setOpen] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", handler);
    return () => document.removeEventListener("mousedown", handler);
  }, []);

  const filtered = useMemo(() => ALL_SCHOOLS.filter(s => {
    if (typeFilter !== "ALL" && s.type !== typeFilter) return false;
    const q = search.toLowerCase();
    return !q || s.name.toLowerCase().includes(q) || (STATE_NAMES[s.state]||"").toLowerCase().includes(q);
  }), [search, typeFilter]);

  const grouped = useMemo(() => {
    const g = {};
    filtered.forEach(s => { const st = STATE_NAMES[s.state]||s.state; if(!g[st]) g[st]=[]; g[st].push(s); });
    return Object.entries(g).sort(([a],[b]) => a.localeCompare(b));
  }, [filtered]);

  const toggle = name => setSelected(p => p.includes(name) ? p.filter(x=>x!==name) : [...p,name]);

  const label = selected.length === 0 ? "Choose institutions…"
    : selected.length === 1 ? (selected[0].length > 54 ? selected[0].slice(0,54)+"…" : selected[0])
    : `${selected.length} institutions selected`;

  const iStyle = { width:"100%",padding:"7px 10px",border:"1.5px solid #e2e8f0",borderRadius:5,fontSize:13,outline:"none",color:"#1a202c",boxSizing:"border-box" };

  return (
    <div ref={ref} style={{position:"relative"}}>
      <button onClick={() => setOpen(o=>!o)} style={{
        width:"100%",padding:"10px 14px",background:"#fff",border:"1.5px solid #e2e8f0",borderRadius:6,
        display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer",
        fontSize:14,color:selected.length?"#1a202c":"#a0aec0",textAlign:"left",transition:"border-color 0.15s",
      }}>
        <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{label}</span>
        <span style={{fontSize:10,color:"#a0aec0",marginLeft:10,flexShrink:0,display:"inline-block",transform:open?"rotate(180deg)":"none",transition:"transform 0.2s"}}>▼</span>
      </button>

      {open && (
        <div style={{
          position:"absolute",top:"calc(100% + 4px)",left:0,right:0,zIndex:200,
          background:"#fff",border:"1.5px solid #e2e8f0",borderRadius:8,
          boxShadow:"0 8px 30px rgba(0,0,0,0.10)",maxHeight:360,display:"flex",flexDirection:"column",
        }}>
          <div style={{padding:"10px 12px",borderBottom:"1px solid #f7fafc"}}>
            <input autoFocus value={search} onChange={e=>setSearch(e.target.value)}
              placeholder="Search schools or states…" style={iStyle} />
            <div style={{display:"flex",gap:6,marginTop:8}}>
              {[["Select all",()=>setSelected(filtered.map(s=>s.name))],["Clear",()=>setSelected([])]].map(([lbl,fn])=>(
                <button key={lbl} onClick={fn} style={{
                  flex:1,padding:"4px 0",background:"#f7fafc",border:"1px solid #e2e8f0",
                  borderRadius:4,cursor:"pointer",fontSize:12,color:"#718096",
                }}>{lbl}{lbl==="Select all"?` (${filtered.length})`:""}</button>
              ))}
            </div>
          </div>
          <div style={{overflowY:"auto",flex:1}}>
            {grouped.map(([state,schools])=>(
              <div key={state}>
                <div style={{padding:"7px 14px 2px",fontSize:10,fontWeight:700,color:"#a0aec0",letterSpacing:"0.12em",textTransform:"uppercase"}}>{state}</div>
                {schools.map(s=>(
                  <div key={s.name} onClick={()=>toggle(s.name)} style={{
                    display:"flex",alignItems:"center",gap:10,padding:"8px 14px",cursor:"pointer",
                    background:selected.includes(s.name)?"#fff5f5":"transparent",
                    borderLeft:`3px solid ${selected.includes(s.name)?RED:"transparent"}`,transition:"background 0.1s",
                  }}
                    onMouseEnter={e=>{if(!selected.includes(s.name))e.currentTarget.style.background="#f7fafc";}}
                    onMouseLeave={e=>{e.currentTarget.style.background=selected.includes(s.name)?"#fff5f5":"transparent";}}
                  >
                    <div style={{
                      width:15,height:15,borderRadius:3,flexShrink:0,
                      border:`2px solid ${selected.includes(s.name)?RED:"#cbd5e0"}`,
                      background:selected.includes(s.name)?RED:"#fff",
                      display:"flex",alignItems:"center",justifyContent:"center",
                    }}>
                      {selected.includes(s.name)&&<span style={{color:"#fff",fontSize:10,fontWeight:900}}>✓</span>}
                    </div>
                    <span style={{fontSize:13,color:"#2d3748",flex:1,lineHeight:1.35}}>{s.name}</span>
                    <span style={{
                      fontSize:10,fontWeight:700,padding:"2px 6px",borderRadius:3,flexShrink:0,
                      background:s.type==="MD"?"#ebf8ff":"#f3e8ff",color:s.type==="MD"?"#2b6cb0":"#6b21a8",
                    }}>{s.type}</span>
                  </div>
                ))}
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  const [selected, setSelected] = useState([]);
  const [specialty, setSpecialty] = useState("");
  const [typeFilter, setTypeFilter] = useState("ALL");
  const [minH, setMinH] = useState("");
  const [minGrants, setMinGrants] = useState("");
  const [rankFilter, setRankFilter] = useState("ALL");
  const [results, setResults] = useState([]);
  const [loading, setLoading] = useState(false);
  const [ran, setRan] = useState(false);
  const [sortCol, setSortCol] = useState("name");
  const [sortDir, setSortDir] = useState("asc");
  const [tableSearch, setTableSearch] = useState("");
  const [progress, setProgress] = useState(0);
  const [progressStep, setProgressStep] = useState("");

  const canRun = selected.length > 0 && specialty && !loading;

  const runSearch = async () => {
    if (!canRun) return;
    setLoading(true); setRan(false); setResults([]); setProgress(0);
    const steps = [
      `Scraping directories at ${selected.length} institution${selected.length>1?"s":""}…`,
      "Querying NIH Reporter for active grants…",
      "Fetching Scopus H-index data…",
      "Running QC & deduplication…",
      "Finalizing results…",
    ];
    for (let i = 0; i < steps.length; i++) {
      setProgressStep(steps[i]);
      await new Promise(r => setTimeout(r, 600 + Math.random()*700));
      setProgress(Math.round(((i+1)/steps.length)*100));
    }
    const schoolObjs = ALL_SCHOOLS.filter(s => selected.includes(s.name));
    setResults(generateMockFaculty(schoolObjs, specialty, Math.max(10, selected.length*5)));
    setLoading(false); setRan(true);
  };

  const displayed = useMemo(() => {
    let r = results;
    if (tableSearch) { const q=tableSearch.toLowerCase(); r=r.filter(f=>f.name.toLowerCase().includes(q)||f.school.toLowerCase().includes(q)); }
    if (minH) r=r.filter(f=>f.hIndex>=+minH);
    if (minGrants) r=r.filter(f=>f.nihGrants>=+minGrants);
    if (rankFilter!=="ALL") r=r.filter(f=>f.title.toLowerCase().includes(rankFilter.toLowerCase()));
    return [...r].sort((a,b)=>{
      let av=a[sortCol],bv=b[sortCol];
      if(typeof av==="string"){av=av.toLowerCase();bv=bv.toLowerCase();}
      return sortDir==="asc"?(av<bv?-1:av>bv?1:0):(av>bv?-1:av<bv?1:0);
    });
  }, [results,tableSearch,minH,minGrants,rankFilter,sortCol,sortDir]);

  const sort = col => { if(sortCol===col) setSortDir(d=>d==="asc"?"desc":"asc"); else{setSortCol(col);setSortDir("asc");} };

  const exportCSV = () => {
    const hdr=["Name","School","State","Degree","Title","Specialty","H-Index","NIH Grants","Email","Confidence"];
    const rows=displayed.map(f=>[f.name,f.school,f.state,f.type,f.title,f.specialty,f.hIndex,f.nihGrants,f.email,f.confidence+"%"]);
    const csv=[hdr,...rows].map(r=>r.map(v=>`"${v}"`).join(",")).join("\n");
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
    a.download=`faculty_${specialty.replace(/\s+/g,"_")}.csv`;
    a.click();
  };

  const inp = { width:"100%",padding:"9px 12px",border:"1.5px solid #e2e8f0",borderRadius:6,fontSize:14,color:"#1a202c",outline:"none",background:"#fff" };
  const Th = ({label,col}) => (
    <th onClick={()=>col&&sort(col)} style={{
      padding:"11px 16px",textAlign:"left",fontSize:11,fontWeight:700,letterSpacing:"0.07em",
      textTransform:"uppercase",color:"#718096",cursor:col?"pointer":"default",whiteSpace:"nowrap",
      background:"#f7fafc",borderBottom:"2px solid #e2e8f0",userSelect:"none",
    }}>
      {label}{col&&<span style={{marginLeft:4,color:sortCol===col?RED:"#cbd5e0"}}>{sortCol===col?(sortDir==="asc"?"↑":"↓"):"↕"}</span>}
    </th>
  );

  return (
    <div style={{minHeight:"100vh",background:"#f7fafc"}}>

      {/* Top bar */}
      <div style={{background:RED,padding:"0 40px"}}>
        <div style={{maxWidth:1280,margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between",height:48}}>
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            <span style={{color:"#fff",fontSize:11,fontWeight:800,letterSpacing:"0.2em",textTransform:"uppercase"}}>Faculty Intelligence</span>
            <span style={{width:1,height:14,background:"rgba(255,255,255,0.3)"}}/>
            <span style={{color:"rgba(255,255,255,0.65)",fontSize:11}}>{MD_SCHOOLS.length} MD · {DO_SCHOOLS.length} DO programs</span>
          </div>
          {ran&&<span style={{color:"rgba(255,255,255,0.85)",fontSize:12,fontWeight:600}}>{displayed.length} of {results.length} results shown</span>}
        </div>
      </div>

      {/* Header */}
      <div style={{background:"#fff",borderBottom:"1px solid #e2e8f0",padding:"28px 40px"}}>
        <div style={{maxWidth:1280,margin:"0 auto",display:"flex",alignItems:"flex-end",justifyContent:"space-between"}}>
          <div>
            <h1 style={{fontFamily:"'Playfair Display',serif",fontSize:42,fontWeight:900,color:"#1a202c",lineHeight:1.05,marginBottom:6}}>MedFaculty Search</h1>
            <p style={{fontSize:14,color:"#718096"}}>Discover &amp; export faculty across every accredited U.S. medical school</p>
          </div>
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            <div style={{width:8,height:8,borderRadius:"50%",background:"#48bb78"}}/>
            <span style={{fontSize:12,color:"#718096"}}>NIH Reporter · Scopus · LCME · AOA</span>
          </div>
        </div>
      </div>

      <div style={{maxWidth:1280,margin:"0 auto",padding:"28px 40px"}}>

        {/* Search panel */}
        <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:10,padding:"24px 28px",marginBottom:20,boxShadow:"0 1px 3px rgba(0,0,0,0.04)"}}>

          {/* Type pills */}
          <div style={{display:"flex",gap:6,marginBottom:20,paddingBottom:20,borderBottom:"1px solid #f7fafc",alignItems:"center"}}>
            <span style={{fontSize:11,fontWeight:700,color:"#a0aec0",textTransform:"uppercase",letterSpacing:"0.08em",marginRight:8}}>Program type</span>
            {[["ALL","All Programs"],["MD","MD Programs"],["DO","DO Programs"]].map(([val,lbl])=>(
              <button key={val} onClick={()=>{setTypeFilter(val);setSelected([]);}} style={{
                padding:"5px 16px",borderRadius:20,border:"1.5px solid",cursor:"pointer",fontWeight:600,fontSize:13,transition:"all 0.15s",
                borderColor:typeFilter===val?RED:"#e2e8f0",background:typeFilter===val?RED:"#fff",color:typeFilter===val?"#fff":"#718096",
              }}>{lbl}</button>
            ))}
          </div>

          {/* Institutions + Specialty */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:16}}>
            <div>
              <label style={{display:"block",fontSize:11,fontWeight:700,color:"#4a5568",letterSpacing:"0.07em",textTransform:"uppercase",marginBottom:7}}>
                Institutions {selected.length>0&&<span style={{color:RED}}>· {selected.length} selected</span>}
              </label>
              <SchoolSelector selected={selected} setSelected={setSelected} typeFilter={typeFilter}/>
            </div>
            <div>
              <label style={{display:"block",fontSize:11,fontWeight:700,color:"#4a5568",letterSpacing:"0.07em",textTransform:"uppercase",marginBottom:7}}>Specialty / Discipline</label>
              <div style={{position:"relative"}}>
                <select value={specialty} onChange={e=>setSpecialty(e.target.value)}
                  style={{...inp,appearance:"none",cursor:"pointer",paddingRight:32,color:specialty?"#1a202c":"#a0aec0"}}>
                  <option value="">Select a specialty…</option>
                  {SPECIALTIES.map(s=><option key={s} value={s}>{s}</option>)}
                </select>
                <span style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",fontSize:10,color:"#a0aec0",pointerEvents:"none"}}>▼</span>
              </div>
            </div>
          </div>

          {/* Filters */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12,marginBottom:20}}>
            <div>
              <label style={{display:"block",fontSize:11,fontWeight:700,color:"#4a5568",letterSpacing:"0.07em",textTransform:"uppercase",marginBottom:7}}>Min H-Index</label>
              <input type="number" min="0" value={minH} onChange={e=>setMinH(e.target.value)} placeholder="e.g. 10" style={inp}/>
            </div>
            <div>
              <label style={{display:"block",fontSize:11,fontWeight:700,color:"#4a5568",letterSpacing:"0.07em",textTransform:"uppercase",marginBottom:7}}>Min NIH Grants</label>
              <input type="number" min="0" value={minGrants} onChange={e=>setMinGrants(e.target.value)} placeholder="e.g. 1" style={inp}/>
            </div>
            <div>
              <label style={{display:"block",fontSize:11,fontWeight:700,color:"#4a5568",letterSpacing:"0.07em",textTransform:"uppercase",marginBottom:7}}>Academic Rank</label>
              <div style={{position:"relative"}}>
                <select value={rankFilter} onChange={e=>setRankFilter(e.target.value)}
                  style={{...inp,appearance:"none",cursor:"pointer",paddingRight:32}}>
                  <option value="ALL">All ranks</option>
                  <option value="Assistant">Assistant Professor</option>
                  <option value="Associate">Associate Professor</option>
                  <option value="Professor">Full Professor</option>
                  <option value="Instructor">Instructor</option>
                  <option value="Clinical">Clinical Professor</option>
                </select>
                <span style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",fontSize:10,color:"#a0aec0",pointerEvents:"none"}}>▼</span>
              </div>
            </div>
          </div>

          <button onClick={runSearch} disabled={!canRun} style={{
            width:"100%",padding:"13px",borderRadius:6,border:"none",
            background:canRun?RED:"#e2e8f0",color:canRun?"#fff":"#a0aec0",
            fontSize:15,fontWeight:700,cursor:canRun?"pointer":"not-allowed",letterSpacing:"0.03em",
            transition:"background 0.15s",boxShadow:canRun?"0 2px 10px rgba(192,57,43,0.25)":"none",
          }}
            onMouseEnter={e=>canRun&&(e.currentTarget.style.background="#a93226")}
            onMouseLeave={e=>canRun&&(e.currentTarget.style.background=RED)}
          >
            {loading?"Running pipeline…":"Run Faculty Search"}
          </button>
        </div>

        {/* Progress */}
        {loading&&(
          <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:10,padding:"20px 24px",marginBottom:20,animation:"fadeUp 0.25s ease"}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
              <div style={{width:15,height:15,border:`2px solid ${RED}`,borderTopColor:"transparent",borderRadius:"50%",animation:"spin 0.7s linear infinite",flexShrink:0}}/>
              <span style={{fontSize:13,color:"#4a5568",fontWeight:500}}>{progressStep}</span>
              <span style={{marginLeft:"auto",fontSize:13,color:RED,fontWeight:700}}>{progress}%</span>
            </div>
            <div style={{height:3,background:"#f7fafc",borderRadius:99,overflow:"hidden"}}>
              <div style={{height:"100%",background:RED,width:`${progress}%`,transition:"width 0.4s ease",borderRadius:99}}/>
            </div>
            <div style={{display:"flex",gap:20,marginTop:10}}>
              {["Agent 1: Scraper","Agent 2: Enricher","Agent 3: QC"].map((agent,i)=>(
                <div key={agent} style={{display:"flex",alignItems:"center",gap:5}}>
                  <div style={{width:7,height:7,borderRadius:"50%",background:progress>=(i+1)*33?RED:progress>=i*33+5?"#feb2b2":"#e2e8f0",transition:"background 0.3s"}}/>
                  <span style={{fontSize:11,color:"#718096"}}>{agent}</span>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* Results */}
        {ran&&!loading&&(
          <div style={{animation:"fadeUp 0.3s ease"}}>
            {/* Stat cards */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:20}}>
              {[
                {label:"Faculty Found",value:results.length,red:true},
                {label:"Avg H-Index",value:results.length?Math.round(results.reduce((s,f)=>s+f.hIndex,0)/results.length):"—"},
                {label:"NIH-Funded",value:results.filter(f=>f.nihGrants>0).length},
                {label:"QC Flagged",value:results.filter(f=>f.flagged).length},
              ].map(({label,value,red})=>(
                <div key={label} style={{background:red?RED:"#fff",border:`1px solid ${red?RED:"#e2e8f0"}`,borderRadius:8,padding:"16px 20px",boxShadow:"0 1px 3px rgba(0,0,0,0.04)"}}>
                  <div style={{fontFamily:"'Playfair Display',serif",fontSize:32,fontWeight:900,color:red?"#fff":"#1a202c",lineHeight:1}}>{value}</div>
                  <div style={{fontSize:11,color:red?"rgba(255,255,255,0.7)":"#a0aec0",marginTop:4,fontWeight:600,letterSpacing:"0.06em",textTransform:"uppercase"}}>{label}</div>
                </div>
              ))}
            </div>

            {/* Toolbar */}
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12,gap:12,flexWrap:"wrap"}}>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <span style={{fontFamily:"'Playfair Display',serif",fontSize:22,fontWeight:700,color:"#1a202c"}}>Results</span>
                <span style={{fontSize:12,background:"#f7fafc",border:"1px solid #e2e8f0",color:"#718096",padding:"2px 10px",borderRadius:20,fontWeight:600}}>{displayed.length} shown</span>
                {displayed.length<results.length&&<span style={{fontSize:12,color:RED,fontWeight:600}}>({results.length-displayed.length} filtered out)</span>}
              </div>
              <div style={{display:"flex",gap:8}}>
                <div style={{position:"relative"}}>
                  <input value={tableSearch} onChange={e=>setTableSearch(e.target.value)} placeholder="Search results…"
                    style={{padding:"7px 12px 7px 30px",border:"1.5px solid #e2e8f0",borderRadius:6,fontSize:13,outline:"none",color:"#1a202c",width:200}}/>
                  <span style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",fontSize:13,color:"#a0aec0",pointerEvents:"none"}}>⌕</span>
                </div>
                <button onClick={exportCSV} style={{
                  padding:"7px 16px",border:"1.5px solid #e2e8f0",borderRadius:6,background:"#fff",
                  fontSize:13,fontWeight:600,cursor:"pointer",color:"#4a5568",transition:"all 0.15s",
                }}
                  onMouseEnter={e=>{e.currentTarget.style.borderColor=RED;e.currentTarget.style.color=RED;}}
                  onMouseLeave={e=>{e.currentTarget.style.borderColor="#e2e8f0";e.currentTarget.style.color="#4a5568";}}
                >↓ Export CSV</button>
              </div>
            </div>

            {/* Table */}
            <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:10,overflow:"hidden",boxShadow:"0 1px 3px rgba(0,0,0,0.04)"}}>
              <div style={{overflowX:"auto"}}>
                <table style={{width:"100%",borderCollapse:"collapse"}}>
                  <thead>
                    <tr>
                      {[["Name","name"],["Institution","school"],["Rank","title"],["Degree","type"],["H-Index","hIndex"],["NIH Grants","nihGrants"],["Confidence","confidence"],["Email",null]].map(([label,col])=>(
                        <Th key={label} label={label} col={col}/>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {displayed.map(f=>(
                      <tr key={f.id} className="result-row">
                        <td style={{padding:"12px 16px",borderBottom:"1px solid #f7fafc"}}>
                          <div style={{display:"flex",alignItems:"center",gap:7}}>
                            {f.flagged&&<span title="QC flagged" style={{color:RED,fontSize:12}}>⚑</span>}
                            <span style={{fontWeight:600,fontSize:14,color:"#1a202c",whiteSpace:"nowrap"}}>{f.name}</span>
                          </div>
                        </td>
                        <td style={{padding:"12px 16px",borderBottom:"1px solid #f7fafc"}}>
                          <div style={{fontSize:13,color:"#4a5568",maxWidth:260,lineHeight:1.4}}>{f.school}</div>
                          <div style={{fontSize:11,color:"#a0aec0",marginTop:2}}>{STATE_NAMES[f.state]}</div>
                        </td>
                        <td style={{padding:"12px 16px",borderBottom:"1px solid #f7fafc",fontSize:13,color:"#4a5568",whiteSpace:"nowrap"}}>{f.title}</td>
                        <td style={{padding:"12px 16px",borderBottom:"1px solid #f7fafc"}}>
                          <span style={{fontSize:11,fontWeight:700,padding:"3px 8px",borderRadius:3,background:f.type==="MD"?"#ebf8ff":"#f3e8ff",color:f.type==="MD"?"#2b6cb0":"#6b21a8"}}>{f.type}</span>
                        </td>
                        <td style={{padding:"12px 16px",borderBottom:"1px solid #f7fafc",textAlign:"center"}}>
                          <span style={{fontWeight:700,fontSize:15,color:f.hIndex>=25?"#276749":f.hIndex>=10?"#975a16":"#718096"}}>{f.hIndex}</span>
                        </td>
                        <td style={{padding:"12px 16px",borderBottom:"1px solid #f7fafc",textAlign:"center"}}>
                          <div style={{display:"flex",gap:3,justifyContent:"center"}}>
                            {[0,1,2,3].map(n=><div key={n} style={{width:9,height:9,borderRadius:2,background:n<f.nihGrants?RED:"#e2e8f0"}}/>)}
                          </div>
                        </td>
                        <td style={{padding:"12px 16px",borderBottom:"1px solid #f7fafc"}}>
                          <div style={{display:"flex",alignItems:"center",gap:8}}>
                            <div style={{width:48,height:3,background:"#f7fafc",borderRadius:99,overflow:"hidden"}}>
                              <div style={{height:"100%",borderRadius:99,width:`${f.confidence}%`,background:f.confidence>=90?"#276749":f.confidence>=78?"#975a16":RED}}/>
                            </div>
                            <span style={{fontSize:12,color:"#718096",fontWeight:600}}>{f.confidence}%</span>
                          </div>
                        </td>
                        <td style={{padding:"12px 16px",borderBottom:"1px solid #f7fafc"}}>
                          <a href={`mailto:${f.email}`} style={{fontSize:12,color:RED,textDecoration:"none",fontWeight:500}}
                            onMouseEnter={e=>e.currentTarget.style.textDecoration="underline"}
                            onMouseLeave={e=>e.currentTarget.style.textDecoration="none"}
                          >{f.email}</a>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              {displayed.length===0&&(
                <div style={{padding:"52px 0",textAlign:"center",color:"#a0aec0",fontSize:13}}>No results match current filters.</div>
              )}
            </div>
          </div>
        )}

        {/* Empty state */}
        {!ran&&!loading&&(
          <div style={{textAlign:"center",padding:"72px 0"}}>
            <div style={{width:56,height:56,borderRadius:"50%",border:"2px solid #e2e8f0",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 16px",color:"#cbd5e0",fontSize:22}}>+</div>
            <div style={{fontSize:14,color:"#a0aec0"}}>Select institutions and a specialty to begin.</div>
          </div>
        )}
      </div>

      {/* Footer */}
      <div style={{borderTop:"1px solid #e2e8f0",padding:"16px 40px",marginTop:32,background:"#fff"}}>
        <div style={{maxWidth:1280,margin:"0 auto",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:12,color:"#a0aec0"}}>MedFaculty Search · {MD_SCHOOLS.length+DO_SCHOOLS.length} accredited programs</span>
          <span style={{fontSize:12,color:"#a0aec0"}}>Sources: LCME · AOA · NIH Reporter · Scopus</span>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
